<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Electrizen Carpool</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .vertical-aisle-text {
      writing-mode: vertical-lr;
      transform: rotate(180deg);
    }
    /* Custom subtle scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;

</head>
<body class="min-h-screen bg-slate-50 text-slate-900 flex flex-col antialiased selection:bg-indigo-600 selection:text-white">

  <!-- ==========================================
       FLOATING TOAST NOTIFICATION CONTAINER
  =========================================== -->
  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 max-w-sm hidden transition-all duration-200"></div>

  <!-- ==========================================
       TOP NAVIGATION HEADER
  =========================================== -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
        <!-- Brand Logo & Title -->
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-11 h-11 rounded-2xl bg-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-200 shrink-0">
              <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2" />
                <circle cx="7" cy="17" r="2" />
                <path d="M9 17h6" />
                <circle cx="17" cy="17" r="2" />
              </svg>
            </div>
            <div>
              <div class="flex flex-wrap items-center gap-2">
                <h1 class="text-lg sm:text-xl font-extrabold tracking-tight text-slate-900">
                  Electrizen Carpool
                </h1>
                <span id="syncStatusBadge" class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-100 text-emerald-800">
                  <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                  <span id="syncStatusText">Live Sync</span>
                </span>
              </div>
              <p class="text-xs text-slate-500">
                Supports 5-Seat (2-3), 7-Seat (2-3-2 or 2-2-3), 8-Seat, or custom seat layouts
              </p>
            </div>
          </div>

          <!-- Mobile Add Car Button -->
          <button
            type="button"
            onclick="window.appActions.openAddCarModal()"
            class="md:hidden inline-flex items-center gap-1.5 px-3 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold shadow-sm"
          >
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
            <span>Add Car</span>
          </button>
        </div>

        <!-- Right Controls: Quick Name & Add Vehicle -->
        <div class="flex flex-wrap items-center gap-2 sm:gap-2.5">
          <!-- Quick Name Input -->
          <div class="flex items-center bg-slate-100 rounded-xl px-3 py-1.5 border border-slate-200 flex-1 sm:flex-initial">
            <svg class="w-4 h-4 text-slate-400 mr-2 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
            <input
              id="quickNameInput"
              type="text"
              placeholder="Your name (for quick seat claim)..."
              oninput="window.appActions.setQuickName(this.value)"
              class="bg-transparent text-xs sm:text-sm text-slate-800 placeholder-slate-400 focus:outline-none w-full sm:w-48"
            />
            <button
              id="clearQuickNameBtn"
              type="button"
              onclick="window.appActions.setQuickName('')"
              class="hidden text-slate-400 hover:text-slate-600 ml-1"
              title="Clear name"
            >
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
          </div>

          <!-- Desktop Add Vehicle Button -->
          <button
            type="button"
            onclick="window.appActions.openAddCarModal()"
            class="hidden md:inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold shadow-sm transition-colors"
          >
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
            <span>Add Vehicle</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- ==========================================
       MAIN CONTENT CONTAINER
  =========================================== -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
    <!-- Alert / Error Banner -->
    <div id="errorBanner" class="hidden bg-amber-50 border border-amber-300 rounded-2xl p-4 flex items-start justify-between gap-3 text-amber-900 text-sm">
      <div class="flex items-start gap-3">
        <svg class="w-5 h-5 text-amber-600 shrink-0 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>
        </svg>
        <div id="errorBannerText"></div>
      </div>
    </div>

    <!-- Top Summary Cards -->
    <section id="statsContainer" class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4"></section>

    <!-- View Mode Switcher, Legend & Search -->
    <section class="bg-white rounded-2xl p-3 sm:p-4 border border-slate-200 shadow-sm flex flex-col lg:flex-row lg:items-center lg:justify-between gap-3">
      <!-- Tabs -->
      <div class="flex items-center gap-2 bg-slate-100 p-1 rounded-xl w-full lg:w-auto">
        <button
          id="tabCarsBtn"
          type="button"
          onclick="window.appActions.setTab('cars')"
          class="flex-1 lg:flex-initial inline-flex items-center justify-center gap-2 px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all bg-white text-indigo-600 shadow-sm"
        >
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/>
          </svg>
          <span id="tabCarsLabel">Interactive Vehicles (0)</span>
        </button>
        <button
          id="tabManifestBtn"
          type="button"
          onclick="window.appActions.setTab('manifest')"
          class="flex-1 lg:flex-initial inline-flex items-center justify-center gap-2 px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all text-slate-600 hover:text-slate-900"
        >
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/>
          </svg>
          <span id="tabManifestLabel">All Passengers List (0)</span>
        </button>
      </div>

      <!-- Legend -->
      <div class="flex flex-wrap items-center gap-3 text-xs text-slate-600 px-1">
        <div class="flex items-center gap-1.5">
          <span class="w-3.5 h-3.5 rounded bg-slate-900 inline-block border border-slate-800"></span>
          <span>Driver</span>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="w-3.5 h-3.5 rounded bg-emerald-100 border border-dashed border-emerald-500 inline-block"></span>
          <span>Open Seat</span>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="w-3.5 h-3.5 rounded bg-white border-2 border-indigo-500 inline-block"></span>
          <span>Confirmed Rider</span>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="w-3.5 h-3.5 rounded bg-amber-100 border-2 border-amber-400 inline-block"></span>
          <span>Interested / Maybe</span>
        </div>
      </div>

      <!-- Search Filter -->
      <div class="relative w-full lg:w-64">
        <svg class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
        </svg>
        <input
          id="searchInput"
          type="text"
          oninput="window.appActions.setSearch(this.value)"
          placeholder="Search car, layout, person..."
          class="w-full pl-9 pr-8 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white"
        />
        <button
          id="clearSearchBtn"
          type="button"
          onclick="window.appActions.setSearch('')"
          class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600"
        >
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </section>

    <!-- Dynamic Main View Area -->
    <div id="mainViewArea"></div>
  </main>

  <!-- ==========================================
       MODAL CONTAINER
  =========================================== -->
  <div id="modalRoot"></div>

  <!-- ==========================================
       FOOTER
  =========================================== -->
  <footer class="bg-white border-t border-slate-200 py-4 px-4 sm:px-6 lg:px-8 mt-auto">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2 text-xs text-slate-400">
      <span>
        Real-Time Carpool Coordinator • Supports 5-Seat (2-3), 7-Seat (2-3-2 &amp; 2-2-3), 8-Seat &amp; Custom Layouts
      </span>
      <span id="sessionFooterId" class="font-mono text-[11px] text-slate-400">
        Session ID: Connecting...
      </span>
    </div>
  </footer>

  <!-- ==========================================
       APPLICATION LOGIC & FIREBASE REAL-TIME SYNC
  =========================================== -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import {
      getAuth,
      signInAnonymously,
      signInWithCustomToken,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import {
      getFirestore,
      collection,
      doc,
      addDoc,
      updateDoc,
      deleteDoc,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // =========================================================================
    // ELECTRIZEN CARPOOL - FIREBASE CONFIGURATION
    // =========================================================================
    const YOUR_OWN_FIREBASE_CONFIG = {
      apiKey: "AIzaSyD1u7EQ4pngmPO4XGMlSqk8BkW4uLD3Qdc",
      authDomain: "electrizen-carpool.firebaseapp.com",
      projectId: "electrizen-carpool",
      storageBucket: "electrizen-carpool.firebasestorage.app",
      messagingSenderId: "759888682053",
      appId: "1:759888682053:web:0c7f7106d6971d028a572c",
      measurementId: "G-7WB608EP04"
    };

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'electrizen-carpool-app';
    let firebaseConfig = YOUR_OWN_FIREBASE_CONFIG;
    if (typeof __firebase_config !== 'undefined' && __firebase_config) {
      try {
        const envConfig = JSON.parse(__firebase_config);
        if (envConfig && envConfig.apiKey) {
          firebaseConfig = envConfig;
        }
      } catch (e) {
        console.error("Failed to parse environment firebase config:", e);
      }
    }

    // ==========================================
    // SEATING LAYOUT PRESETS & GENERATOR
    // ==========================================
    const OWNER_VERIFICATION_CODE = 'ELZ-7492';

    const LAYOUT_PRESETS = [
      {
        id: '2-3',
        name: '5-Seat Sedan / SUV',
        badge: '5 Seats (2-3)',
        rows: [2, 3],
        description: 'Standard 2-row 5-seater (Driver + 1 front, 3 rear bench)'
      },
      {
        id: '2-3-2',
        name: '7-Seat Standard MPV / SUV',
        badge: '7 Seats (2-3-2)',
        rows: [2, 3, 2],
        description: '3-row 7-seater with 3-seat middle bench & 2-seat third row'
      },
      {
        id: '2-2-3',
        name: '7-Seat Captain Chairs',
        badge: '7 Seats (2-2-3)',
        rows: [2, 2, 3],
        description: '2nd-row Captain Chairs with center walkthrough aisle & 3-seat back row'
      },
      {
        id: '2-2-2',
        name: '6-Seat Captain Chairs',
        badge: '6 Seats (2-2-2)',
        rows: [2, 2, 2],
        description: 'Spacious 3-row 6-seater with dual Captain Chairs in middle & rear'
      },
      {
        id: '2-3-3',
        name: '8-Seat Minivan / SUV',
        badge: '8 Seats (2-3-3)',
        rows: [2, 3, 3],
        description: 'Full-size 8-passenger van with 3-seat benches in rows 2 & 3'
      },
      {
        id: '2-2',
        name: '4-Seat Compact / Coupe',
        badge: '4 Seats (2-2)',
        rows: [2, 2],
        description: 'Compact 2-row 4-seater with 2 front and 2 rear bucket seats'
      }
    ];

    const CAR_THEMES = {
      indigo: {
        name: 'Midnight Indigo',
        bg: 'bg-indigo-600',
        lightBg: 'bg-indigo-50',
        border: 'border-indigo-200',
        bodyBorder: 'border-indigo-300',
        bodyGrad: 'from-indigo-50/80 via-white to-indigo-50/40',
        accent: 'text-indigo-600',
        dot: 'bg-indigo-500'
      },
      emerald: {
        name: 'Forest Emerald',
        bg: 'bg-emerald-600',
        lightBg: 'bg-emerald-50',
        border: 'border-emerald-200',
        bodyBorder: 'border-emerald-300',
        bodyGrad: 'from-emerald-50/80 via-white to-emerald-50/40',
        accent: 'text-emerald-600',
        dot: 'bg-emerald-500'
      },
      rose: {
        name: 'Crimson Rose',
        bg: 'bg-rose-600',
        lightBg: 'bg-rose-50',
        border: 'border-rose-200',
        bodyBorder: 'border-rose-300',
        bodyGrad: 'from-rose-50/80 via-white to-rose-50/40',
        accent: 'text-rose-600',
        dot: 'bg-rose-500'
      },
      amber: {
        name: 'Sunset Amber',
        bg: 'bg-amber-600',
        lightBg: 'bg-amber-50',
        border: 'border-amber-200',
        bodyBorder: 'border-amber-300',
        bodyGrad: 'from-amber-50/80 via-white to-amber-50/40',
        accent: 'text-amber-600',
        dot: 'bg-amber-500'
      },
      cyan: {
        name: 'Ocean Cyan',
        bg: 'bg-cyan-600',
        lightBg: 'bg-cyan-50',
        border: 'border-cyan-200',
        bodyBorder: 'border-cyan-300',
        bodyGrad: 'from-cyan-50/80 via-white to-cyan-50/40',
        accent: 'text-cyan-600',
        dot: 'bg-cyan-500'
      },
      slate: {
        name: 'Titanium Slate',
        bg: 'bg-slate-700',
        lightBg: 'bg-slate-100',
        border: 'border-slate-200',
        bodyBorder: 'border-slate-300',
        bodyGrad: 'from-slate-100/80 via-white to-slate-50/40',
        accent: 'text-slate-700',
        dot: 'bg-slate-600'
      }
    };

    // Escape HTML to prevent XSS
    const escapeHtml = (str) => {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    };

    const getInitials = (name) => {
      if (!name || !name.trim()) return '';
      const parts = name.trim().split(/\s+/);
      if (parts.length === 1) return parts[0].substring(0, 2).toUpperCase();
      return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
    };

    const getCarLayoutRows = (car) => {
      if (Array.isArray(car?.layoutRows) && car.layoutRows.length > 0) {
        return car.layoutRows.map((n) => Math.min(4, Math.max(1, Number(n) || 1)));
      }
      if (typeof car?.layoutType === 'string' && car.layoutType.includes('-')) {
        const parsed = car.layoutType
          .split('-')
          .map((n) => parseInt(n, 10))
          .filter((n) => !isNaN(n) && n >= 1 && n <= 4);
        if (parsed.length >= 1 && parsed.length <= 4) return parsed;
      }
      return [2, 3, 2];
    };

    const formatLayoutPattern = (rows) => rows.join('-');

    const getLayoutTitle = (rows) => {
      const pattern = formatLayoutPattern(rows);
      const preset = LAYOUT_PRESETS.find((p) => p.id === pattern);
      const totalSeats = rows.reduce((sum, count) => sum + count, 0);
      if (preset) return `${preset.name} (${pattern})`;
      return `${totalSeats}-Seat Custom (${pattern})`;
    };

    const getSeatsForLayout = (rowsInput = [2, 3, 2]) => {
      const rows = Array.isArray(rowsInput) && rowsInput.length > 0 ? rowsInput : [2, 3, 2];
      const letters = ['A', 'B', 'C', 'D'];
      const seats = [];

      rows.forEach((seatCountInRow, rowIndex) => {
        const rowNum = rowIndex + 1;
        const count = Math.min(4, Math.max(1, Number(seatCountInRow) || 1));

        for (let sIdx = 0; sIdx < count; sIdx++) {
          let id = `r${rowNum}_s${sIdx + 1}`;
          let label = `Row ${rowNum} Seat ${letters[sIdx]}`;
          let shortLabel = `${rowNum}${letters[sIdx]}`;
          let position = `Row ${rowNum} • Seat ${letters[sIdx]}`;
          let description = `Row ${rowNum} passenger seat`;
          let isDriver = false;
          let isCaptain = false;

          if (rowNum === 1) {
            if (sIdx === 0) {
              id = 'driver';
              label = 'Driver';
              shortLabel = 'DRV';
              position = 'Row 1 • Driver';
              description = 'Primary vehicle operator';
              isDriver = true;
            } else if (sIdx === 1) {
              id = 'front_pax';
              label = 'Front Passenger';
              shortLabel = '1B';
              position = 'Row 1 • Front Shotgun';
              description = 'Co-pilot / front passenger seat';
            } else {
              id = `front_extra_${sIdx}`;
              label = sIdx === 2 ? 'Front Center / Aux' : `Front Seat 1${letters[sIdx]}`;
              shortLabel = `1${letters[sIdx]}`;
              position = `Row 1 • Front ${letters[sIdx]}`;
              description = 'Front bench passenger seat';
            }
          } else if (rowNum === 2) {
            const hasThirdRow = rows.length >= 3;
            if (count === 1) {
              id = 'mid_left';
              label = 'Middle Solo Seat';
              shortLabel = '2A';
              position = 'Row 2 • Solo';
            } else if (count === 2) {
              id = sIdx === 0 ? 'mid_left' : 'mid_right';
              isCaptain = hasThirdRow;
              label =
                sIdx === 0
                  ? hasThirdRow
                    ? 'Left Captain Chair'
                    : 'Rear Left'
                  : hasThirdRow
                  ? 'Right Captain Chair'
                  : 'Rear Right';
              shortLabel = `2${letters[sIdx]}`;
              position = `Row 2 • ${sIdx === 0 ? 'Left' : 'Right'} ${
                hasThirdRow ? 'Captain Chair' : 'Seat'
              }`;
              description = hasThirdRow
                ? '2nd row captain chair with center aisle access'
                : 'Second row passenger seat';
            } else if (count === 3) {
              const ids3 = ['mid_left', 'mid_center', 'mid_right'];
              const pos3 = ['Left Window', 'Center Bench', 'Right Window'];
              id = ids3[sIdx];
              label =
                rows.length === 2
                  ? `Rear ${sIdx === 0 ? 'Left' : sIdx === 1 ? 'Center' : 'Right'}`
                  : `Middle ${sIdx === 0 ? 'Left' : sIdx === 1 ? 'Center' : 'Right'}`;
              shortLabel = `2${letters[sIdx]}`;
              position = `Row 2 • ${pos3[sIdx]}`;
              description = `Second row ${pos3[sIdx].toLowerCase()} seat`;
            } else {
              const ids4 = ['mid_left', 'mid_center', 'mid_right', 'mid_extra_4'];
              id = ids4[sIdx];
              label = `Row 2 Seat 2${letters[sIdx]}`;
              shortLabel = `2${letters[sIdx]}`;
              position = `Row 2 • Seat 2${letters[sIdx]}`;
            }
          } else if (rowNum === 3) {
            if (count === 1) {
              id = 'back_left';
              label = 'Back Solo Seat';
              shortLabel = '3A';
              position = 'Row 3 • Solo';
            } else if (count === 2) {
              id = sIdx === 0 ? 'back_left' : 'back_right';
              label = sIdx === 0 ? 'Back Left' : 'Back Right';
              shortLabel = `3${letters[sIdx]}`;
              position = `Row 3 • ${sIdx === 0 ? 'Left' : 'Right'}`;
              description = `Third row ${sIdx === 0 ? 'left' : 'right'} seat`;
            } else if (count === 3) {
              const ids3 = ['back_left', 'back_center', 'back_right'];
              const pos3 = ['Left Window', 'Center Bench', 'Right Window'];
              id = ids3[sIdx];
              label = `Back ${sIdx === 0 ? 'Left' : sIdx === 1 ? 'Center' : 'Right'}`;
              shortLabel = `3${letters[sIdx]}`;
              position = `Row 3 • ${pos3[sIdx]}`;
              description = `Third row ${pos3[sIdx].toLowerCase()} seat`;
            } else {
              const ids4 = ['back_left', 'back_center', 'back_right', 'back_extra_4'];
              id = ids4[sIdx];
              label = `Row 3 Seat 3${letters[sIdx]}`;
              shortLabel = `3${letters[sIdx]}`;
              position = `Row 3 • Seat 3${letters[sIdx]}`;
            }
          } else {
            id = `row${rowNum}_seat${sIdx + 1}`;
            label = `Row ${rowNum} ${
              sIdx === 0 ? 'Left' : sIdx === count - 1 ? 'Right' : `Seat ${letters[sIdx]}`
            }`;
            shortLabel = `${rowNum}${letters[sIdx]}`;
            position = `Row ${rowNum} • Seat ${rowNum}${letters[sIdx]}`;
            description = `Fourth row passenger seat`;
          }

          seats.push({
            id,
            label,
            shortLabel,
            row: rowNum,
            seatIndexInRow: sIdx,
            seatsInThisRow: count,
            position,
            isDriver,
            isCaptain,
            description
          });
        }
      });

      return seats;
    };

    const createEmptySeats = (driverName = '', layoutRows = [2, 3, 2]) => {
      const seatDefs = getSeatsForLayout(layoutRows);
      const seatsObj = {};
      seatDefs.forEach((def) => {
        if (def.isDriver) {
          seatsObj[def.id] = {
            name: driverName.trim(),
            note: driverName.trim() ? 'Car owner / Driver' : '',
            status: 'confirmed',
            updatedAt: Date.now()
          };
        } else {
          seatsObj[def.id] = { name: '', note: '', status: 'confirmed', updatedAt: null };
        }
      });
      return seatsObj;
    };

    const reconcileSeatsForNewLayout = (
      existingSeats = {},
      newLayoutRows = [2, 3, 2],
      driverNameOverride = null
    ) => {
      const newSeatDefs = getSeatsForLayout(newLayoutRows);
      const newSeatIds = new Set(newSeatDefs.map((d) => d.id));
      const updatedSeats = {};

      newSeatDefs.forEach((def) => {
        const existing = existingSeats[def.id];
        if (existing && existing.name && existing.name.trim() !== '') {
          updatedSeats[def.id] = { ...existing };
        } else {
          updatedSeats[def.id] = { name: '', note: '', status: 'confirmed', updatedAt: null };
        }
      });

      if (driverNameOverride !== null) {
        updatedSeats.driver = {
          ...(updatedSeats.driver || {}),
          name: driverNameOverride.trim(),
          note: updatedSeats.driver?.note || (driverNameOverride.trim() ? 'Driver' : ''),
          status: updatedSeats.driver?.status || 'confirmed',
          updatedAt: Date.now()
        };
      }

      let relocatedCount = 0;
      let overflowCount = 0;

      Object.entries(existingSeats).forEach(([oldSeatId, seatData]) => {
        if (!newSeatIds.has(oldSeatId) && seatData?.name && seatData.name.trim() !== '') {
          const openTargetDef = newSeatDefs.find(
            (def) =>
              !def.isDriver &&
              (!updatedSeats[def.id]?.name || updatedSeats[def.id].name.trim() === '')
          );

          if (openTargetDef) {
            updatedSeats[openTargetDef.id] = {
              ...seatData,
              updatedAt: Date.now()
            };
            relocatedCount += 1;
          } else {
            updatedSeats[oldSeatId] = { ...seatData };
            overflowCount += 1;
          }
        }
      });

      return { updatedSeats, relocatedCount, overflowCount };
    };

    // ==========================================
    // APPLICATION STATE
    // ==========================================
    const state = {
      user: null,
      db: null,
      isCloudConnected: false,
      loading: true,
      cars: [],
      myQuickName: '',
      activeTab: 'cars',
      searchQuery: '',
      quickLayoutCarId: null,
      activeModal: null, // 'car' | 'seat' | 'confirm'
      carModal: {
        mode: 'add',
        carId: null,
        name: '',
        driverName: '',
        departureTime: '',
        pickupLocation: '',
        note: '',
        colorTheme: 'indigo',
        driveSide: 'LHD',
        layoutRows: [2, 3, 2],
        isCustomLayout: false,
        verificationCode: ''
      },
      seatModal: {
        carId: null,
        carName: '',
        seatDef: null,
        name: '',
        note: '',
        status: 'confirmed'
      },
      confirmModal: {
        title: '',
        message: '',
        confirmLabel: 'Confirm',
        confirmStyle: 'danger',
        onConfirm: null
      }
    };

    let toastTimer = null;
    const showToast = (message, type = 'success') => {
      const container = document.getElementById('toastContainer');
      if (!container) return;
      if (toastTimer) clearTimeout(toastTimer);

      const isErr = type === 'error';
      container.className = 'fixed bottom-5 right-5 z-50 max-w-sm animate-bounce';
      container.innerHTML = `
        <div class="flex items-center gap-2.5 px-4 py-3 rounded-2xl shadow-xl border text-sm font-medium ${
          isErr
            ? 'bg-rose-600 text-white border-rose-700'
            : 'bg-slate-900 text-white border-slate-700'
        }">
          ${
            isErr
              ? `<svg class="w-4 h-4 text-rose-200 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>`
              : `<svg class="w-4 h-4 text-emerald-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`
          }
          <span>${escapeHtml(message)}</span>
        </div>
      `;

      toastTimer = setTimeout(() => {
        container.className = 'hidden';
      }, 3200);
    };

    // ==========================================
    // COMPUTE STATS & PASSENGER MANIFEST
    // ==========================================
    const computeSummary = () => {
      const totalCars = state.cars.length;
      let totalCapacity = 0;
      let totalOccupied = 0;
      let totalInterested = 0;
      const allPassengers = [];

      state.cars.forEach((car) => {
        const layoutRows = getCarLayoutRows(car);
        const seatDefs = getSeatsForLayout(layoutRows);
        const activeIds = new Set(seatDefs.map((d) => d.id));
        totalCapacity += seatDefs.length;

        const seats = car.seats || {};
        seatDefs.forEach((seatDef) => {
          const seatData = seats[seatDef.id];
          if (seatData && seatData.name && seatData.name.trim() !== '') {
            totalOccupied += 1;
            if (seatData.status === 'interested') totalInterested += 1;
            allPassengers.push({
              carId: car.id,
              carName: car.name,
              carLayout: formatLayoutPattern(layoutRows),
              carTheme: car.colorTheme || 'indigo',
              seatId: seatDef.id,
              seatLabel: seatDef.label,
              seatShort: seatDef.shortLabel,
              isDriver: seatDef.isDriver,
              passengerName: seatData.name.trim(),
              passengerNote: seatData.note || '',
              status: seatData.status || 'confirmed'
            });
          }
        });

        Object.entries(seats).forEach(([seatKey, seatData]) => {
          if (!activeIds.has(seatKey) && seatData?.name && seatData.name.trim() !== '') {
            totalOccupied += 1;
            if (seatData.status === 'interested') totalInterested += 1;
            allPassengers.push({
              carId: car.id,
              carName: car.name,
              carLayout: formatLayoutPattern(layoutRows),
              carTheme: car.colorTheme || 'indigo',
              seatId: seatKey,
              seatLabel: 'Overflow (Needs Seat)',
              seatShort: 'OVF',
              isDriver: false,
              passengerName: seatData.name.trim(),
              passengerNote: seatData.note || '',
              status: seatData.status || 'confirmed'
            });
          }
        });
      });

      return {
        totalCars,
        totalCapacity,
        totalOccupied,
        totalAvailable: Math.max(0, totalCapacity - totalOccupied),
        totalInterested,
        allPassengers
      };
    };

    // ==========================================
    // RENDER FUNCTIONS
    // ==========================================
    const renderSeatButtonHtml = (car, seatDef, theme) => {
      const seatData = car.seats?.[seatDef.id] || { name: '', note: '', status: 'confirmed' };
      const isOccupied = Boolean(seatData.name && seatData.name.trim() !== '');
      const isInterested = isOccupied && seatData.status === 'interested';
      const isDriver = seatDef.isDriver;
      const isMe =
        isOccupied &&
        state.myQuickName.trim() !== '' &&
        seatData.name.trim().toLowerCase() === state.myQuickName.trim().toLowerCase();

      const btnClasses = isOccupied
        ? isDriver
          ? 'bg-slate-900 border-slate-800 text-white'
          : isInterested
          ? 'bg-amber-50/95 border-amber-400 text-slate-900'
          : 'bg-white border-indigo-500 text-slate-900'
        : 'bg-emerald-50/60 hover:bg-emerald-50 border-dashed border-emerald-400/80 text-emerald-900';

      const headrestClass = isOccupied
        ? isDriver || isInterested
          ? 'bg-amber-400'
          : theme.bg
        : 'bg-emerald-300/80 group-hover:bg-emerald-400';

      const badgeClass = isOccupied
        ? isDriver
          ? 'bg-slate-800 text-amber-300'
          : isInterested
          ? 'bg-amber-200/80 text-amber-900'
          : 'bg-slate-100 text-slate-600'
        : 'bg-emerald-100 text-emerald-800';

      return `
        <button
          type="button"
          onclick="window.appActions.openSeatModal('${escapeHtml(car.id)}', '${escapeHtml(seatDef.id)}')"
          class="group relative flex flex-col items-center justify-between p-2.5 sm:p-3 rounded-2xl border-2 transition-all duration-200 text-left w-full min-h-[96px] sm:min-h-[104px] shadow-sm hover:shadow-md hover:-translate-y-0.5 active:translate-y-0 focus:outline-none focus:ring-2 focus:ring-offset-1 focus:ring-indigo-500 ${btnClasses}"
        >
          <div class="w-10 sm:w-12 h-2 rounded-full mb-1.5 transition-colors ${headrestClass}"></div>

          <div class="w-full flex items-center justify-between gap-1 text-[10px] font-semibold uppercase tracking-wider">
            <span class="px-1.5 py-0.5 rounded-md ${badgeClass}">${escapeHtml(seatDef.shortLabel)}</span>
            ${
              isDriver
                ? `<span class="flex items-center gap-0.5 text-amber-400 font-bold">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                      <circle cx="12" cy="12" r="9" />
                      <circle cx="12" cy="12" r="2.5" />
                      <path d="M12 14.5V21M9.5 12H3M14.5 12H21" />
                    </svg>
                   </span>`
                : isOccupied
                ? isInterested
                  ? `<span class="text-[9px] px-1.5 py-0.5 rounded bg-amber-200 text-amber-900 font-bold">Maybe</span>`
                  : `<span class="w-2 h-2 rounded-full bg-indigo-500" title="Confirmed Seat"></span>`
                : `<span class="text-[10px] text-emerald-700 font-bold">Open</span>`
            }
          </div>

          <div class="my-1 w-full flex flex-col items-center justify-center text-center">
            ${
              isOccupied
                ? `
                  <div class="flex items-center justify-center gap-1 max-w-full">
                    <span class="text-xs sm:text-sm font-bold leading-tight line-clamp-1 break-all ${
                      isDriver ? 'text-white' : 'text-slate-900'
                    }" title="${escapeHtml(seatData.name)}">
                      ${escapeHtml(seatData.name)}
                    </span>
                  </div>
                  ${
                    seatData.note
                      ? `<span class="mt-0.5 text-[10px] leading-tight line-clamp-1 max-w-full px-1 rounded ${
                          isDriver
                            ? 'text-slate-300'
                            : isInterested
                            ? 'text-amber-800'
                            : 'text-slate-500'
                        }" title="${escapeHtml(seatData.note)}">"${escapeHtml(seatData.note)}"</span>`
                      : `<span class="mt-0.5 text-[10px] text-slate-400">${escapeHtml(seatDef.label)}</span>`
                  }
                `
                : `
                  <div class="flex flex-col items-center py-0.5">
                    <div class="w-6 h-6 rounded-full bg-emerald-100 group-hover:bg-emerald-200 text-emerald-700 flex items-center justify-center mb-0.5 transition-colors">
                      <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
                    </div>
                    <span class="text-[11px] font-semibold text-emerald-800">${
                      isDriver ? 'Assign Driver' : 'Claim Seat'
                    }</span>
                  </div>
                `
            }
          </div>

          ${
            isMe
              ? `<span class="absolute -top-2 -right-2 bg-indigo-600 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full shadow">YOU</span>`
              : ''
          }
        </button>
      `;
    };

    const renderApp = () => {
      const summary = computeSummary();

      // 1. Render Top Summary Stats
      const statsEl = document.getElementById('statsContainer');
      if (statsEl) {
        statsEl.innerHTML = `
          <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm flex items-center justify-between">
            <div>
              <p class="text-xs font-medium text-slate-500">Total Vehicles</p>
              <p class="text-2xl font-extrabold text-slate-900 mt-0.5">${summary.totalCars}</p>
              <p class="text-[11px] text-slate-400 mt-0.5">Flexible 4 to 16 seat layouts</p>
            </div>
            <div class="w-10 h-10 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center">
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>
            </div>
          </div>

          <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm flex items-center justify-between">
            <div>
              <p class="text-xs font-medium text-slate-500">Open Seats Left</p>
              <p class="text-2xl font-extrabold text-emerald-600 mt-0.5">${summary.totalAvailable}</p>
              <p class="text-[11px] text-slate-400 mt-0.5">of ${summary.totalCapacity} total capacity</p>
            </div>
            <div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center">
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></svg>
            </div>
          </div>

          <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm flex items-center justify-between">
            <div>
              <p class="text-xs font-medium text-slate-500">Assigned Riders</p>
              <p class="text-2xl font-extrabold text-indigo-600 mt-0.5">${summary.totalOccupied}</p>
              <p class="text-[11px] text-slate-400 mt-0.5">Drivers &amp; passengers combined</p>
            </div>
            <div class="w-10 h-10 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center">
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            </div>
          </div>

          <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm flex items-center justify-between">
            <div>
              <p class="text-xs font-medium text-slate-500">Interested / Tentative</p>
              <p class="text-2xl font-extrabold text-amber-600 mt-0.5">${summary.totalInterested}</p>
              <p class="text-[11px] text-slate-400 mt-0.5">Marked as "Maybe / Interested"</p>
            </div>
            <div class="w-10 h-10 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center">
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
            </div>
          </div>
        `;
      }

      // 2. Update Tab Labels & Styles
      const tabCarsBtn = document.getElementById('tabCarsBtn');
      const tabManifestBtn = document.getElementById('tabManifestBtn');
      const tabCarsLabel = document.getElementById('tabCarsLabel');
      const tabManifestLabel = document.getElementById('tabManifestLabel');

      if (tabCarsLabel) tabCarsLabel.textContent = `Interactive Vehicles (${state.cars.length})`;
      if (tabManifestLabel)
        tabManifestLabel.textContent = `All Passengers List (${summary.allPassengers.length})`;

      if (tabCarsBtn && tabManifestBtn) {
        if (state.activeTab === 'cars') {
          tabCarsBtn.className =
            'flex-1 lg:flex-initial inline-flex items-center justify-center gap-2 px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all bg-white text-indigo-600 shadow-sm';
          tabManifestBtn.className =
            'flex-1 lg:flex-initial inline-flex items-center justify-center gap-2 px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all text-slate-600 hover:text-slate-900';
        } else {
          tabManifestBtn.className =
            'flex-1 lg:flex-initial inline-flex items-center justify-center gap-2 px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all bg-white text-indigo-600 shadow-sm';
          tabCarsBtn.className =
            'flex-1 lg:flex-initial inline-flex items-center justify-center gap-2 px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all text-slate-600 hover:text-slate-900';
        }
      }

      // 3. Render Main Content Area
      const mainEl = document.getElementById('mainViewArea');
      if (!mainEl) return;

      if (state.loading) {
        mainEl.innerHTML = `
          <div class="bg-white rounded-3xl p-12 border border-slate-200 text-center space-y-3">
            <div class="w-12 h-12 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center mx-auto animate-pulse">
              <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>
            </div>
            <p class="text-base font-bold text-slate-800">Syncing live carpool lineup...</p>
            <p class="text-xs text-slate-500">Connecting to real-time seat assignment board</p>
          </div>
        `;
        return;
      }

      if (state.cars.length === 0) {
        mainEl.innerHTML = `
          <div class="bg-white rounded-3xl p-8 sm:p-12 border border-slate-200 text-center max-w-2xl mx-auto my-4 shadow-sm space-y-5">
            <div class="w-16 h-16 rounded-3xl bg-indigo-50 text-indigo-600 flex items-center justify-center mx-auto shadow-inner">
              <svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>
            </div>
            <div class="space-y-2">
              <h2 class="text-xl sm:text-2xl font-extrabold text-slate-900">No Carpool Vehicles Added Yet</h2>
              <p class="text-sm text-slate-500 max-w-md mx-auto">
                Add a vehicle with any seating configuration—5-seat (2-3), 7-seat (2-3-2 or 2-2-3 Captain Chairs), 8-seat (2-3-3), or build your own custom layout.
              </p>
            </div>
            <div class="flex flex-wrap items-center justify-center gap-3 pt-2">
              <button
                type="button"
                onclick="window.appActions.openAddCarModal()"
                class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold shadow-md shadow-indigo-100 transition-all"
              >
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
                <span>Add First Vehicle</span>
              </button>
              <button
                type="button"
                onclick="window.appActions.seedSampleCars()"
                class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold transition-all"
              >
                <svg class="w-4 h-4 text-amber-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
                <span>Load Sample Cars (2-3-2, 2-2-3, 2-3)</span>
              </button>
            </div>
          </div>
        `;
        return;
      }

      const q = state.searchQuery.trim().toLowerCase();
      const filteredCars = !q
        ? state.cars
        : state.cars.filter((car) => {
            const pattern = formatLayoutPattern(getCarLayoutRows(car));
            if (car.name?.toLowerCase().includes(q)) return true;
            if (pattern.toLowerCase().includes(q)) return true;
            if (car.note?.toLowerCase().includes(q)) return true;
            if (car.pickupLocation?.toLowerCase().includes(q)) return true;
            if (car.departureTime?.toLowerCase().includes(q)) return true;
            const seats = car.seats || {};
            return Object.values(seats).some(
              (s) => s?.name?.toLowerCase().includes(q) || s?.note?.toLowerCase().includes(q)
            );
          });

      if (state.activeTab === 'cars') {
        const cardsHtml = filteredCars
          .map((car) => {
            const theme = CAR_THEMES[car.colorTheme] || CAR_THEMES.indigo;
            const layoutRows = getCarLayoutRows(car);
            const layoutPattern = formatLayoutPattern(layoutRows);
            const seatDefs = getSeatsForLayout(layoutRows);
            const totalCapacity = seatDefs.length;
            const activeSeatIds = new Set(seatDefs.map((d) => d.id));
            const seats = car.seats || {};
            const occupiedCount = seatDefs.filter(
              (s) => seats[s.id]?.name && seats[s.id].name.trim() !== ''
            ).length;
            const availableCount = Math.max(0, totalCapacity - occupiedCount);
            const isRHD = car.driveSide === 'RHD';
            const isQuickPickerOpen = state.quickLayoutCarId === car.id;

            const rowsGrouped = layoutRows.map((_, rIdx) => {
              const rowNum = rIdx + 1;
              const rowSeats = seatDefs.filter((s) => s.row === rowNum);
              if (rowNum === 1 && isRHD) return [...rowSeats].reverse();
              return rowSeats;
            });

            const overflowEntries = Object.entries(seats).filter(
              ([seatKey, sData]) =>
                !activeSeatIds.has(seatKey) && sData?.name && sData.name.trim() !== ''
            );

            const rowsHtml = rowsGrouped
              .map((rowSeats, rIdx) => {
                const rowNum = rIdx + 1;
                const seatsInRow = rowSeats.length;
                const totalRows = rowsGrouped.length;
                const isCaptainRowWithAisle =
                  rowNum === 2 && seatsInRow === 2 && totalRows >= 3;

                const rowTitle =
                  rowNum === 1
                    ? `Row 1 • Front (${seatsInRow} ${seatsInRow === 1 ? 'Seat' : 'Seats'})`
                    : isCaptainRowWithAisle
                    ? 'Row 2 • Captain Chairs (2 Seats + Aisle)'
                    : rowNum === totalRows
                    ? `Row ${rowNum} • Rear Row (${seatsInRow} ${
                        seatsInRow === 1 ? 'Seat' : 'Seats'
                      })`
                    : `Row ${rowNum} • Middle Row (${seatsInRow} ${
                        seatsInRow === 1 ? 'Seat' : 'Seats'
                      })`;

                let rowGridHtml = '';
                if (isCaptainRowWithAisle) {
                  rowGridHtml = `
                    <div class="grid grid-cols-7 gap-2 items-stretch">
                      <div class="col-span-3">${renderSeatButtonHtml(car, rowSeats[0], theme)}</div>
                      <div class="col-span-1 flex flex-col items-center justify-center rounded-xl border border-dashed border-slate-300/80 bg-slate-100/60 py-2 px-0.5 text-center">
                        <span class="text-[8px] font-extrabold uppercase tracking-tighter text-slate-400 vertical-aisle-text">AISLE</span>
                      </div>
                      <div class="col-span-3">${renderSeatButtonHtml(car, rowSeats[1], theme)}</div>
                    </div>
                  `;
                } else if (seatsInRow === 1) {
                  rowGridHtml = `<div class="max-w-[170px] mx-auto">${renderSeatButtonHtml(
                    car,
                    rowSeats[0],
                    theme
                  )}</div>`;
                } else if (seatsInRow === 2) {
                  rowGridHtml = `<div class="grid grid-cols-2 gap-6 sm:gap-8 items-stretch ${
                    rowNum >= 3 ? 'px-2' : ''
                  }">${rowSeats.map((s) => renderSeatButtonHtml(car, s, theme)).join('')}</div>`;
                } else if (seatsInRow === 3) {
                  rowGridHtml = `<div class="grid grid-cols-3 gap-2 sm:gap-2.5 items-stretch">${rowSeats
                    .map((s) => renderSeatButtonHtml(car, s, theme))
                    .join('')}</div>`;
                } else {
                  rowGridHtml = `<div class="grid grid-cols-4 gap-1.5 sm:gap-2 items-stretch">${rowSeats
                    .map((s) => renderSeatButtonHtml(car, s, theme))
                    .join('')}</div>`;
                }

                return `
                  <div class="mb-4 last:mb-3">
                    <div class="flex items-center justify-between mb-1.5 px-1">
                      <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400">${escapeHtml(
                        rowTitle
                      )}</span>
                      <span class="text-[10px] text-slate-400">${
                        rowNum === 1
                          ? isRHD
                            ? 'Right-Hand Drive'
                            : 'Left-Hand Drive'
                          : rowSeats.map((s) => s.shortLabel).join(' • ')
                      }</span>
                    </div>
                    ${rowGridHtml}
                  </div>
                `;
              })
              .join('');

            const footerPillsHtml = seatDefs
              .map((seatDef) => {
                const s = seats[seatDef.id];
                if (!s?.name?.trim()) return '';
                const pillStyle = seatDef.isDriver
                  ? 'bg-slate-900 text-white'
                  : s.status === 'interested'
                  ? 'bg-amber-100 text-amber-900 border border-amber-300'
                  : 'bg-slate-100 hover:bg-slate-200 text-slate-800';
                return `
                  <button
                    type="button"
                    onclick="window.appActions.openSeatModal('${escapeHtml(car.id)}', '${escapeHtml(
                  seatDef.id
                )}')"
                    class="inline-flex items-center gap-1 px-2 py-1 rounded-lg font-medium transition-colors ${pillStyle}"
                  >
                    <span class="text-[10px] opacity-75">${escapeHtml(seatDef.shortLabel)}:</span>
                    <span>${escapeHtml(s.name.trim())}</span>
                  </button>
                `;
              })
              .join('');

            return `
              <div class="bg-white rounded-3xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow overflow-hidden flex flex-col">
                <!-- Header -->
                <div class="p-5 border-b border-slate-100 flex flex-col gap-3">
                  <div class="flex items-start justify-between gap-2">
                    <div class="flex items-start gap-3">
                      <div class="w-10 h-10 rounded-2xl ${
                        theme.bg
                      } text-white flex items-center justify-center shrink-0 shadow-sm mt-0.5">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>
                      </div>
                      <div>
                        <div class="flex flex-wrap items-center gap-2">
                          <h3 class="text-base sm:text-lg font-extrabold text-slate-900">${escapeHtml(
                            car.name
                          )}</h3>
                          <span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full ${
                            availableCount === 0
                              ? 'bg-rose-100 text-rose-700'
                              : 'bg-emerald-100 text-emerald-800'
                          }">
                            ${
                              availableCount === 0
                                ? `FULL (${totalCapacity}/${totalCapacity})`
                                : `${availableCount} of ${totalCapacity} open`
                            }
                          </span>
                        </div>

                        <div class="flex flex-wrap items-center gap-2.5 mt-1.5 text-xs text-slate-600">
                          <button
                            type="button"
                            onclick="window.appActions.toggleQuickLayout('${escapeHtml(car.id)}')"
                            class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg font-bold text-[11px] border transition-all ${
                              isQuickPickerOpen
                                ? 'bg-indigo-600 text-white border-indigo-600'
                                : 'bg-slate-100 hover:bg-indigo-50 text-slate-700 hover:text-indigo-700 border-slate-200'
                            }"
                            title="Switch seating layout (2-3, 2-3-2, 2-2-3, etc.)"
                          >
                            <span>${totalCapacity} Seats (${escapeHtml(layoutPattern)})</span>
                            <svg class="w-3 h-3 ml-0.5 opacity-75" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg>
                          </button>

                          ${
                            car.departureTime
                              ? `<span class="inline-flex items-center gap-1 font-medium">
                                  <svg class="w-3.5 h-3.5 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                                  ${escapeHtml(car.departureTime)}
                                 </span>`
                              : ''
                          }
                          ${
                            car.pickupLocation
                              ? `<span class="inline-flex items-center gap-1 font-medium">
                                  <svg class="w-3.5 h-3.5 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
                                  ${escapeHtml(car.pickupLocation)}
                                 </span>`
                              : ''
                          }

                      </div>
                    </div>

                    <!-- Card Actions -->
                    <div class="flex items-center gap-1 shrink-0">
                      <button
                        type="button"

                        title="Edit car details &amp; layout"
                      >
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                      </button>
                      <button
                        type="button"
                        onclick="window.appActions.clearCarSeats('${escapeHtml(car.id)}')"
                        class="p-2 rounded-xl text-slate-500 hover:text-amber-600 hover:bg-amber-50 transition-colors"
                        title="Reset passenger seats"
                      >
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                      </button>
                      <button
                        type="button"
                        onclick="window.appActions.deleteCar('${escapeHtml(car.id)}')"
                        class="p-2 rounded-xl text-slate-500 hover:text-rose-600 hover:bg-rose-50 transition-colors"
                        title="Delete vehicle"
                      >
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                      </button>
                    </div>
                  </div>

                  ${
                    isQuickPickerOpen
                      ? `
                        <div class="p-3.5 rounded-2xl bg-slate-900 text-white space-y-2.5 shadow-lg">
                          <div class="flex items-center justify-between">
                            <span class="text-[11px] font-bold uppercase tracking-wider text-indigo-300">

                              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>

                          <div class="grid grid-cols-2 sm:grid-cols-3 gap-1.5">
                            ${LAYOUT_PRESETS.map((preset) => {
                              const isCurrent = preset.id === layoutPattern;
                              return `
                                <button
                                  type="button"
                                  onclick="window.appActions.quickSwitchLayout('${escapeHtml(
                                    car.id
                                  )}', '${preset.id}')"
                                  class="px-2.5 py-2 rounded-xl text-left transition-all border ${
                                    isCurrent
                                      ? 'bg-indigo-600 border-indigo-400 text-white font-bold'
                                      : 'bg-slate-800 hover:bg-slate-700 border-slate-700 text-slate-200'
                                  }"
                                >
                                  <div class="text-xs font-bold">${escapeHtml(preset.badge)}</div>
                                  <div class="text-[10px] text-slate-300 truncate">${escapeHtml(
                                    preset.name
                                  )}</div>
                                </button>
                              `;
                            }).join('')}
                          </div>
                          <div class="flex items-center justify-between pt-1 border-t border-slate-800">
                            <span class="text-[11px] text-slate-400">Need a custom row arrangement?</span>
                            <button
                              type="button"
                              onclick="window.appActions.openEditCarModal('${escapeHtml(
                                car.id
                              )}', true)"
                              class="text-xs font-bold text-amber-300 hover:text-amber-200 underline"
                            >
                              Custom Layout Builder &rarr;
                            </button>
                          </div>
                        </div>
                      `
                      : ''
                  }

                  ${
                    car.note
                      ? `
                        <div class="px-3.5 py-2.5 rounded-2xl ${theme.lightBg} border ${
                          theme.border
                        } text-xs text-slate-700 flex items-start gap-2">
                          <svg class="w-4 h-4 ${
                            theme.accent
                          } shrink-0 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                          <p class="leading-relaxed">${escapeHtml(car.note)}</p>
                        </div>
                      `
                      : ''
                  }
                </div>

                <!-- Car Chassis Interior -->
                <div class="p-4 sm:p-6 bg-slate-50/70 flex-1 flex flex-col items-center justify-center">
                  <div class="relative w-full max-w-[400px] mx-auto">
                    <div class="absolute top-16 -left-3 w-3 h-7 rounded-l-xl border-2 border-r-0 ${
                      theme.bodyBorder
                    } bg-white shadow-sm"></div>
                    <div class="absolute top-16 -right-3 w-3 h-7 rounded-r-xl border-2 border-l-0 ${
                      theme.bodyBorder
                    } bg-white shadow-sm"></div>

                    <div class="absolute top-12 -left-1.5 w-1.5 h-12 bg-slate-800 rounded-l-md"></div>
                    <div class="absolute top-12 -right-1.5 w-1.5 h-12 bg-slate-800 rounded-r-md"></div>
                    <div class="absolute bottom-14 -left-1.5 w-1.5 h-12 bg-slate-800 rounded-l-md"></div>
                    <div class="absolute bottom-14 -right-1.5 w-1.5 h-12 bg-slate-800 rounded-r-md"></div>

                    <div class="relative rounded-t-[64px] rounded-b-[36px] border-2 ${
                      theme.bodyBorder
                    } bg-gradient-to-b ${theme.bodyGrad} p-4 sm:p-5 shadow-inner">
                      <div class="flex justify-between px-6 -mt-3 mb-2">
                        <div class="w-8 h-2 rounded-full bg-amber-300 border border-amber-400 shadow-sm"></div>
                        <div class="text-[10px] font-bold uppercase tracking-widest text-slate-400">
                          Front • ${escapeHtml(layoutPattern)}
                        </div>
                        <div class="w-8 h-2 rounded-full bg-amber-300 border border-amber-400 shadow-sm"></div>
                      </div>

                      <div class="w-full h-8 rounded-t-[40px] rounded-b-lg bg-slate-800/90 border-b-4 border-slate-700 mb-4 flex items-center justify-between px-5 text-[10px] text-slate-300 font-medium">
                        <span>${isRHD ? 'Passenger' : 'Driver Side'}</span>
                        <span class="text-slate-400 font-semibold">WINDSHIELD</span>
                        <span>${isRHD ? 'Driver Side' : 'Passenger'}</span>
                      </div>

                      ${rowsHtml}

                      <div class="mt-3 pt-2.5 border-t border-dashed border-slate-300 flex items-center justify-between px-3 text-[11px] text-slate-500">
                        <span class="inline-flex items-center gap-1 font-medium">
                          Rear Trunk / Cargo
                        </span>
                        <span class="font-semibold text-slate-700">
                          ${occupiedCount}/${totalCapacity} Seated (${escapeHtml(layoutPattern)})
                        </span>
                      </div>

                      <div class="flex justify-between px-8 mt-2 -mb-3">
                        <div class="w-8 h-1.5 rounded-full bg-rose-500"></div>
                        <div class="w-8 h-1.5 rounded-full bg-rose-500"></div>
                      </div>
                    </div>
                  </div>

                  ${
                    overflowEntries.length > 0
                      ? `
                        <div class="mt-4 w-full max-w-[400px] rounded-2xl bg-amber-50 border border-amber-300 p-3 space-y-2">
                          <div class="flex items-center justify-between text-xs font-bold text-amber-900">
                            <span>Overflow Riders (${overflowEntries.length})</span>
                            <span class="text-[10px] font-medium text-amber-700">Saved from previous layout</span>
                          </div>
                          <div class="space-y-1.5">
                            ${overflowEntries
                              .map(
                                ([seatKey, sData]) => `
                                <div class="flex items-center justify-between gap-2 bg-white px-2.5 py-1.5 rounded-xl border border-amber-200 text-xs">
                                  <div class="truncate">
                                    <span class="font-bold text-slate-900">${escapeHtml(
                                      sData.name
                                    )}</span>
                                    ${
                                      sData.note
                                        ? `<span class="text-slate-500 ml-1">"${escapeHtml(
                                            sData.note
                                          )}"</span>`
                                        : ''
                                    }
                                  </div>
                                  <div class="flex items-center gap-1 shrink-0">
                                    ${
                                      availableCount > 0
                                        ? `<button type="button" onclick="window.appActions.relocateOverflow('${escapeHtml(
                                            car.id
                                          )}', '${escapeHtml(
                                            seatKey
                                          )}')" class="px-2 py-1 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-[10px] font-bold">Move to Open Seat</button>`
                                        : ''
                                    }
                                    <button type="button" onclick="window.appActions.openSeatModal('${escapeHtml(
                                      car.id
                                    )}', '${escapeHtml(
                                      seatKey
                                    )}')" class="px-2 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-[10px] font-bold">Edit</button>
                                  </div>
                                </div>
                              `
                              )
                              .join('')}
                          </div>
                        </div>
                      `
                      : ''
                  }
                </div>

                <!-- Footer Pills -->
                <div class="px-5 py-3.5 bg-white border-t border-slate-100 flex flex-wrap items-center justify-between gap-2 text-xs">
                  <div class="flex flex-wrap items-center gap-1.5">
                    ${
                      occupiedCount > 0
                        ? footerPillsHtml
                        : `<span class="text-slate-400 italic">No seats assigned yet — click any seat above to join!</span>`
                    }
                  </div>
                </div>
              </div>
            `;
          })
          .join('');

        mainEl.innerHTML = `<section class="grid grid-cols-1 lg:grid-cols-2 gap-6">${cardsHtml}</section>`;
      } else {
        // Manifest View
        const filteredPassengers = summary.allPassengers.filter((p) => {
          if (!q) return true;
          return (
            p.passengerName.toLowerCase().includes(q) ||
            p.carName.toLowerCase().includes(q) ||
            p.carLayout.toLowerCase().includes(q) ||
            p.passengerNote.toLowerCase().includes(q) ||
            p.seatLabel.toLowerCase().includes(q)
          );
        });

        mainEl.innerHTML = `
          <section class="space-y-6">
            <div class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
              <div class="px-6 py-4 border-b border-slate-100 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
                <div>
                  <h3 class="text-base font-extrabold text-slate-900">Complete Carpool Passenger Manifest</h3>
                  <p class="text-xs text-slate-500">Click any row to edit that passenger's seat or note</p>
                </div>
                <span class="text-xs font-semibold text-slate-500">
                  Showing ${filteredPassengers.length} assigned seats across ${state.cars.length} cars
                </span>
              </div>
              ${
                filteredPassengers.length === 0
                  ? `<div class="p-10 text-center text-slate-500 text-sm">No matching passengers found.</div>`
                  : `
                    <div class="overflow-x-auto">
                      <table class="w-full text-left border-collapse">
                        <thead>
                          <tr class="bg-slate-50 text-[11px] font-bold uppercase tracking-wider text-slate-500 border-b border-slate-200">
                            <th class="py-3 px-4">Passenger / Driver</th>
                            <th class="py-3 px-4">Vehicle &amp; Layout</th>
                            <th class="py-3 px-4">Seat Position</th>
                            <th class="py-3 px-4">Status</th>
                            <th class="py-3 px-4">Passenger Note</th>
                            <th class="py-3 px-4 text-right">Action</th>
                          </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100 text-sm">
                          ${filteredPassengers
                            .map(
                              (item) => `
                              <tr
                                onclick="window.appActions.openSeatModal('${escapeHtml(
                                  item.carId
                                )}', '${escapeHtml(item.seatId)}')"
                                class="hover:bg-slate-50/90 cursor-pointer transition-colors"
                              >
                                <td class="py-3.5 px-4 font-bold text-slate-900 flex items-center gap-2.5">
                                  <span class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold shrink-0 ${
                                    item.isDriver
                                      ? 'bg-slate-900 text-amber-300'
                                      : 'bg-indigo-100 text-indigo-700'
                                  }">${escapeHtml(getInitials(item.passengerName))}</span>
                                  <span>${escapeHtml(item.passengerName)}</span>
                                </td>
                                <td class="py-3.5 px-4 font-medium text-slate-700">
                                  <div>${escapeHtml(item.carName)}</div>
                                  <div class="text-[11px] text-slate-400">Layout: ${escapeHtml(
                                    item.carLayout
                                  )}</div>
                                </td>
                                <td class="py-3.5 px-4">
                                  <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-md text-xs font-semibold bg-slate-100 text-slate-700">
                                    [${escapeHtml(item.seatShort)}] ${escapeHtml(item.seatLabel)}
                                  </span>
                                </td>
                                <td class="py-3.5 px-4">
                                  ${
                                    item.isDriver
                                      ? `<span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-slate-900 text-amber-300">Driver</span>`
                                      : item.status === 'interested'
                                      ? `<span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-amber-100 text-amber-800">Interested / Maybe</span>`
                                      : `<span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800">Confirmed</span>`
                                  }
                                </td>
                                <td class="py-3.5 px-4 text-slate-500 text-xs">
                                  ${
                                    item.passengerNote
                                      ? escapeHtml(item.passengerNote)
                                      : `<span class="text-slate-300">—</span>`
                                  }
                                </td>
                                <td class="py-3.5 px-4 text-right">
                                  <span class="text-xs font-semibold text-indigo-600 hover:underline">Edit Seat</span>
                                </td>
                              </tr>
                            `
                            )
                            .join('')}
                        </tbody>
                      </table>
                    </div>
                  `
              }
            </div>
          </section>
        `;
      }
    };

    // ==========================================
    // RENDER MODALS
    // ==========================================
    const renderModals = () => {
      const root = document.getElementById('modalRoot');
      if (!root) return;

      if (!state.activeModal) {
        root.innerHTML = '';
        return;
      }

      if (state.activeModal === 'seat') {
        const sm = state.seatModal;
        root.innerHTML = `
          <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-200">
              <div class="flex items-start justify-between gap-3 pb-4 border-b border-slate-100">
                <div>
                  <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-bold bg-indigo-50 text-indigo-700 mb-1">
                    ${escapeHtml(sm.carName)}
                  </span>
                  <h3 class="text-lg font-extrabold text-slate-900">
                    ${escapeHtml(sm.seatDef.label)} (${escapeHtml(sm.seatDef.shortLabel)})
                  </h3>
                  <p class="text-xs text-slate-500 mt-0.5">
                    ${escapeHtml(sm.seatDef.position)} • ${escapeHtml(sm.seatDef.description)}
                  </p>

                      <button

                    <input
                      type="text"

                      oninput="window.appActions.updateCarField('departureTime', this.value)"

                    />
                  </div>
                  <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Meeting / Pickup Spot</label>
                    <input
                      type="text"

                <div>
                  <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Car Note &amp; Carpool Info</label>
                  <textarea
                    rows="2"
                    oninput="window.appActions.updateCarField('note', this.value)"
                    placeholder="Add notes about luggage space, gas split, or pickup stops..."
                    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                  >${escapeHtml(cm.note)}</textarea>
                </div>

                <div>
                  <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Vehicle Accent Color</label>
                  <div class="grid grid-cols-3 sm:grid-cols-6 gap-2">
                    ${Object.entries(CAR_THEMES)
                      .map(
                        ([key, t]) => `
                        <button

                            cm.colorTheme === key
                              ? 'border-slate-900 bg-slate-900 text-white'
                              : 'border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100'

                        >
                          <span class="w-3 h-3 rounded-full ${t.dot}"></span>
                          <span>${key}</span>

                      `
                      )
                      .join('')}

                <div class="flex items-center justify-end gap-2 pt-3 border-t border-slate-100">
                  <button
                    type="button"
                    onclick="window.appActions.closeModal()"

                  >Cancel</button>
                  <button
                    type="submit"
                    class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold shadow-sm"
                  >
