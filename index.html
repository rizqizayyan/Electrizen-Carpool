    // Compute current Monday-based week identifier & date range for automatic weekly seat resets
    const getCurrentWeekInfo = () => {
      const now = new Date();
      const day = now.getDay(); // 0 (Sun) to 6 (Sat)
      const diffToMonday = day === 0 ? -6 : 1 - day;
      const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() + diffToMonday, 0, 0, 0, 0);

      getAudioContext() {
        if (!this.audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            this.audioCtx = new AudioContextClass();
          }
        }
        if (this.audioCtx && this.audioCtx.state === 'suspended') {

        return this.audioCtx;

      // Crisp synthesized interactive UI sound effects
      playSfx(type = 'click') {
        if (!state.sfxEnabled) return;
        try {
          const ctx = this.getAudioContext();
          if (!ctx) return;
          const now = ctx.currentTime;

          if (type === 'click') {
            // Crisp tactile button pop
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(520, now);
            osc.frequency.exponentialRampToValueAtTime(180, now + 0.045);

            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);

            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.05);
          } else if (type === 'seat') {
            // Soft upward two-tone pop when opening a seat
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(380, now);
            osc.frequency.exponentialRampToValueAtTime(640, now + 0.08);

            gain.gain.setValueAtTime(0.14, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.085);

            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.09);
          } else if (type === 'success') {
            // Pleasant ascending major triad chime when claiming a seat or saving a car
            const notes = [523.25, 659.25, 783.99, 1046.5]; // C5, E5, G5, C6
            notes.forEach((freq, idx) => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'triangle';
              const startTime = now + idx * 0.055;
              osc.frequency.setValueAtTime(freq, startTime);

              gain.gain.setValueAtTime(0.11, startTime);
              gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.22);

              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(startTime);
              osc.stop(startTime + 0.23);
            });
          } else if (type === 'clear') {
            // Soft descending two-note tone when vacating or deleting
            const notes = [440, 329.63]; // A4 -> E4
            notes.forEach((freq, idx) => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'sine';
              const startTime = now + idx * 0.065;
              osc.frequency.setValueAtTime(freq, startTime);

              gain.gain.setValueAtTime(0.11, startTime);
              gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.16);

              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(startTime);
              osc.stop(startTime + 0.17);
            });
          } else if (type === 'error') {
            // Gentle low double-buzz for invalid code or error
            [0, 0.09].forEach((offset) => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'sawtooth';
              const startTime = now + offset;
              osc.frequency.setValueAtTime(155, startTime);

              gain.gain.setValueAtTime(0.08, startTime);
              gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.07);

              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(startTime);
              osc.stop(startTime + 0.075);
            });
          }
        } catch (e) {
          console.warn('SFX playback skipped:', e);
        }
      },

      // Chill Lo-Fi Roadtrip Background Music using Tone.js
      async toggleBgm() {
        if (typeof Tone === 'undefined') {
          showToast('Audio library still loading, please try again.', 'error');
          return;
        }

        try {
          await Tone.start();

          if (!this.bgmInitialized) {
            Tone.Transport.bpm.value = 84;

            const reverb = new Tone.Reverb({ decay: 3.5, wet: 0.45 }).toDestination();
            const filter = new Tone.Filter(1400, 'lowpass').connect(reverb);

            // Warm electric piano / synth pad for roadtrip chords
            this.padSynth = new Tone.PolySynth(Tone.Synth, {
              oscillator: { type: 'sine' },
              envelope: { attack: 0.4, decay: 1.2, sustain: 0.6, release: 2.0 }
            }).connect(filter);
            this.padSynth.volume.value = -16;

            // Gentle plucked melody arpeggiator
            this.arpSynth = new Tone.Synth({
              oscillator: { type: 'triangle' },
              envelope: { attack: 0.02, decay: 0.3, sustain: 0.1, release: 0.6 }
            }).connect(reverb);
            this.arpSynth.volume.value = -18;

            // Soft warm sub-bass
            this.bassSynth = new Tone.Synth({
              oscillator: { type: 'sine' },
              envelope: { attack: 0.08, decay: 0.5, sustain: 0.5, release: 1.2 }
            }).toDestination();
            this.bassSynth.volume.value = -17;

            // Chill progression: Fmaj7 -> Em7 -> Dm7 -> Cmaj7
            const progression = [
              { chord: ['F3', 'A3', 'C4', 'E4'], bass: 'F2', arp: ['A4', 'C5', 'E5', 'C5'] },
              { chord: ['E3', 'G3', 'B3', 'D4'], bass: 'E2', arp: ['G4', 'B4', 'D5', 'B4'] },
              { chord: ['D3', 'F3', 'A3', 'C4'], bass: 'D2', arp: ['F4', 'A4', 'C5', 'A4'] },
              { chord: ['C3', 'E3', 'G3', 'B3'], bass: 'C2', arp: ['E4', 'G4', 'B4', 'G4'] }
            ];

            let stepIndex = 0;
            this.chordLoop = new Tone.Loop((time) => {
              const current = progression[stepIndex % progression.length];
              this.padSynth.triggerAttackRelease(current.chord, '1m', time);
              this.bassSynth.triggerAttackRelease(current.bass, '1m', time);

              // Schedule soft arpeggio notes across the bar
              current.arp.forEach((note, idx) => {
                this.arpSynth.triggerAttackRelease(
                  note,
                  '8n',
                  time + idx * Tone.Time('4n').toSeconds()
                );
              });

              stepIndex++;
            }, '1m').start(0);

            this.bgmInitialized = true;
          }

          if (state.bgmPlaying) {
            Tone.Transport.pause();
            state.bgmPlaying = false;
            this.playSfx('click');
          } else {
            Tone.Transport.start();
            state.bgmPlaying = true;
            this.playSfx('seat');
          }

          updateAudioUI();
        } catch (err) {
          console.error('Error toggling background music:', err);
        }
      }
    };

          btn.classList.add('ring-2', 'ring-indigo-500/50', 'text-indigo-600', 'dark:text-indigo-400');
        } else {
          btn.classList.remove('ring-2', 'ring-indigo-500/50', 'text-indigo-600', 'dark:text-indigo-400');
        }
      });

      const sfxOnIcon = `<svg class="w-4 h-4 text-emerald-600 dark:text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>`;
      const sfxOffIcon = `<svg class="w-4 h-4 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="22" x2="16" y1="9" y2="15"/><line x1="16" x2="22" y1="9" y2="15"/></svg>`;

      document.querySelectorAll('.sfx-icon').forEach((el) => {
        el.innerHTML = state.sfxEnabled ? sfxOnIcon : sfxOffIcon;
      });
      document.querySelectorAll('.sfx-label').forEach((el) => {
        el.textContent = state.sfxEnabled ? 'SFX On' : 'SFX Muted';
      });
    };

    const applyDarkModeUI = () => {
      const rootEl = document.documentElement;
      if (state.darkMode) {
        rootEl.classList.add('dark');
      } else {
        rootEl.classList.remove('dark');
      }

      const sunSvg = `<svg class="w-4 h-4 text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>`;
      const moonSvg = `<svg class="w-4 h-4 text-slate-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>`;

      document.querySelectorAll('.dark-mode-icon').forEach((el) => {
        el.innerHTML = state.darkMode ? sunSvg : moonSvg;
      });
      document.querySelectorAll('.dark-mode-label').forEach((el) => {
        el.textContent = state.darkMode ? 'Light' : 'Dark';
      });

      const weekInfo = getCurrentWeekInfo();
      const weekEl = document.getElementById('weeklyCycleText');
      if (weekEl) {
        weekEl.textContent = `Week: ${weekInfo.rangeLabel} (Resets Mon)`;
      }
      updateAudioUI();
    };

    let toastTimer = null;
    const showToast = (message, type = 'success') => {
      soundEngine.playSfx(type === 'error' ? 'error' : 'success');
      const container = document.getElementById('toastContainer');
      if (!container) return;
      if (toastTimer) clearTimeout(toastTimer);

      const isErr = type === 'error';
      container.className = 'fixed bottom-5 right-5 z-50 max-w-sm animate-bounce';
      container.innerHTML = `
        <div class="flex items-center gap-2.5 px-4 py-3 rounded-2xl shadow-xl border text-sm font-medium ${
          isErr
            ? 'bg-rose-600 text-white border-rose-700'
            : 'bg-slate-900 text-white border-slate-700'
        }">
          ${
            isErr
              ? `<svg class="w-4 h-4 text-rose-200 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>`
              : `<svg class="w-4 h-4 text-emerald-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`
          }
          <span>${escapeHtml(message)}</span>
        </div>
      `;

      toastTimer = setTimeout(() => {
        container.className = 'hidden';
      }, 3200);
    };

    // ==========================================
    // COMPUTE STATS & PASSENGER MANIFEST
    // ==========================================
    const computeSummary = () => {
      const totalCars = state.cars.length;
      let totalCapacity = 0;
      let totalOccupied = 0;
      let totalInterested = 0;
      const allPassengers = [];

      state.cars.forEach((car) => {
        const layoutRows = getCarLayoutRows(car);
        const seatDefs = getSeatsForLayout(layoutRows);
        const activeIds = new Set(seatDefs.map((d) => d.id));
        totalCapacity += seatDefs.length;

        const seats = car.seats || {};
        seatDefs.forEach((seatDef) => {
          const seatData = seats[seatDef.id];
          if (seatData && seatData.name && seatData.name.trim() !== '') {
            totalOccupied += 1;
            if (seatData.status === 'interested') totalInterested += 1;
            allPassengers.push({
              carId: car.id,
              carName: car.name,
              carLayout: formatLayoutPattern(layoutRows),
              carTheme: car.colorTheme || 'indigo',
              seatId: seatDef.id,
              seatLabel: seatDef.label,
              seatShort: seatDef.shortLabel,
              isDriver: seatDef.isDriver,
              passengerName: seatData.name.trim(),
              passengerNote: seatData.note || '',
              status: seatData.status || 'confirmed'
            });
          }
        });

        Object.entries(seats).forEach(([seatKey, seatData]) => {
          if (!activeIds.has(seatKey) && seatData?.name && seatData.name.trim() !== '') {
            totalOccupied += 1;
            if (seatData.status === 'interested') totalInterested += 1;
            allPassengers.push({
              carId: car.id,
              carName: car.name,
              carLayout: formatLayoutPattern(layoutRows),
              carTheme: car.colorTheme || 'indigo',
              seatId: seatKey,
              seatLabel: 'Overflow (Needs Seat)',
              seatShort: 'OVF',
              isDriver: false,
              passengerName: seatData.name.trim(),
              passengerNote: seatData.note || '',
              status: seatData.status || 'confirmed'
            });
          }
        });
      });

      return {
        totalCars,
        totalCapacity,
        totalOccupied,
        totalAvailable: Math.max(0, totalCapacity - totalOccupied),
        totalInterested,
        allPassengers
      };
    };

    // ==========================================
    // RENDER FUNCTIONS
    // ==========================================
    const renderSeatButtonHtml = (car, seatDef, theme) => {
      const seatData = car.seats?.[seatDef.id] || { name: '', note: '', status: 'confirmed' };
      const isOccupied = Boolean(seatData.name && seatData.name.trim() !== '');
      const isInterested = isOccupied && seatData.status === 'interested';
      const isDriver = seatDef.isDriver;
      const isMe =
        isOccupied &&
        state.myQuickName.trim() !== '' &&
        seatData.name.trim().toLowerCase() === state.myQuickName.trim().toLowerCase();

      const btnClasses = isOccupied
        ? isDriver
          ? 'bg-slate-900 dark:bg-slate-950 border-slate-800 dark:border-amber-500/60 text-white'
          : isInterested
          ? 'bg-amber-50/95 dark:bg-amber-950/60 border-amber-400 dark:border-amber-500 text-slate-900 dark:text-amber-100'
          : 'bg-white dark:bg-slate-800 border-indigo-500 text-slate-900 dark:text-white'
        : 'bg-emerald-50/60 dark:bg-emerald-950/30 hover:bg-emerald-50 dark:hover:bg-emerald-950/60 border-dashed border-emerald-400/80 dark:border-emerald-500/60 text-emerald-900 dark:text-emerald-200';

      const headrestClass = isOccupied
        ? isDriver || isInterested
          ? 'bg-amber-400'
          : theme.bg
        : 'bg-emerald-300/80 dark:bg-emerald-600/70 group-hover:bg-emerald-400';

      const badgeClass = isOccupied
        ? isDriver
          ? 'bg-slate-800 text-amber-300'
          : isInterested
          ? 'bg-amber-200/80 dark:bg-amber-900 text-amber-900 dark:text-amber-200'
          : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300'
        : 'bg-emerald-100 dark:bg-emerald-900/70 text-emerald-800 dark:text-emerald-200';

      return `
        <button
          type="button"
          onclick="window.appActions.openSeatModal('${escapeHtml(car.id)}', '${escapeHtml(seatDef.id)}')"
          class="group relative flex flex-col items-center justify-between p-2 sm:p-3 rounded-2xl border-2 transition-all duration-200 text-left w-full min-h-[88px] sm:min-h-[104px] shadow-xs hover:shadow-md hover:-translate-y-0.5 active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-offset-1 focus:ring-indigo-500 ${btnClasses}"
        >
          <div class="w-8 sm:w-12 h-1.5 sm:h-2 rounded-full mb-1 transition-colors ${headrestClass}"></div>

          <div class="w-full flex items-center justify-between gap-1 text-[9px] sm:text-[10px] font-semibold uppercase tracking-wider">
            <span class="px-1.5 py-0.5 rounded-md ${badgeClass}">${escapeHtml(seatDef.shortLabel)}</span>
            ${
              isDriver
                ? `<span class="flex items-center gap-0.5 text-amber-400 font-bold">
                    <svg class="w-3 h-3 sm:w-3.5 sm:h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                      <circle cx="12" cy="12" r="9" />
                      <circle cx="12" cy="12" r="2.5" />
                      <path d="M12 14.5V21M9.5 12H3M14.5 12H21" />
                    </svg>
                   </span>`
                : isOccupied
                ? isInterested
                  ? `<span class="text-[8px] sm:text-[9px] px-1 py-0.5 rounded bg-amber-200 dark:bg-amber-800 text-amber-900 dark:text-amber-100 font-bold">Maybe</span>`
                  : `<span class="w-2 h-2 rounded-full bg-indigo-500" title="Confirmed Seat"></span>`
                : `<span class="text-[9px] sm:text-[10px] text-emerald-700 dark:text-emerald-300 font-bold">Open</span>`
            }
          </div>

          <div class="my-1 w-full flex flex-col items-center justify-center text-center">
            ${
              isOccupied
                ? `
                  <div class="flex items-center justify-center gap-1 max-w-full">
                    <span class="text-[11px] sm:text-sm font-bold leading-tight line-clamp-1 break-all ${
                      isDriver ? 'text-white' : 'text-slate-900 dark:text-white'
                    }" title="${escapeHtml(seatData.name)}">
                      ${escapeHtml(seatData.name)}
                    </span>
                  </div>
                  ${
                    seatData.note
                      ? `<span class="mt-0.5 text-[9px] sm:text-[10px] leading-tight line-clamp-1 max-w-full px-1 rounded ${
                          isDriver
                            ? 'text-slate-300'
                            : isInterested
                            ? 'text-amber-800 dark:text-amber-300'
                            : 'text-slate-500 dark:text-slate-400'
                        }" title="${escapeHtml(seatData.note)}">"${escapeHtml(seatData.note)}"</span>`
                      : `<span class="mt-0.5 text-[9px] sm:text-[10px] text-slate-400 line-clamp-1">${escapeHtml(seatDef.label)}</span>`
                  }
                `
                : `
                  <div class="flex flex-col items-center py-0.5">
                    <div class="w-5 h-5 sm:w-6 sm:h-6 rounded-full bg-emerald-100 dark:bg-emerald-900/70 group-hover:bg-emerald-200 dark:group-hover:bg-emerald-800 text-emerald-700 dark:text-emerald-300 flex items-center justify-center mb-0.5 transition-colors">
                      <svg class="w-3 h-3 sm:w-3.5 sm:h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
                    </div>
                    <span class="text-[10px] sm:text-[11px] font-semibold text-emerald-800 dark:text-emerald-300">${
                      isDriver ? 'Driver' : 'Claim'
                    }</span>
                  </div>
                `
            }
          </div>

          ${
            isMe
              ? `<span class="absolute -top-2 -right-1.5 bg-indigo-600 text-white text-[8px] sm:text-[9px] font-bold px-1.5 py-0.5 rounded-full shadow">YOU</span>`
              : ''
          }
        </button>
      `;
    };

    const renderApp = () => {
      const summary = computeSummary();

      // 1. Render Top Summary Stats
      const statsEl = document.getElementById('statsContainer');
      if (statsEl) {
        statsEl.innerHTML = `
          <div class="bg-white dark:bg-slate-900 rounded-2xl p-3 sm:p-4 border border-slate-200 dark:border-slate-800 shadow-xs flex items-center justify-between gap-2 transition-colors">
            <div class="min-w-0">
              <p class="text-[11px] sm:text-xs font-semibold text-slate-500 dark:text-slate-400 truncate">Vehicles</p>
              <p class="text-xl sm:text-2xl font-extrabold text-slate-900 dark:text-white mt-0.5 leading-none">${summary.totalCars}</p>
              <p class="text-[10px] sm:text-[11px] text-slate-400 dark:text-slate-500 mt-1 truncate">Active carpools</p>
            </div>
            <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 flex items-center justify-center shrink-0">
              <svg class="w-4 h-4 sm:w-5 sm:h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>
            </div>
          </div>

          <div class="bg-white dark:bg-slate-900 rounded-2xl p-3 sm:p-4 border border-slate-200 dark:border-slate-800 shadow-xs flex items-center justify-between gap-2 transition-colors">
            <div class="min-w-0">
              <p class="text-[11px] sm:text-xs font-semibold text-slate-500 dark:text-slate-400 truncate">Open Seats</p>
              <p class="text-xl sm:text-2xl font-extrabold text-emerald-600 dark:text-emerald-400 mt-0.5 leading-none">${summary.totalAvailable}</p>
              <p class="text-[10px] sm:text-[11px] text-slate-400 dark:text-slate-500 mt-1 truncate">of ${summary.totalCapacity} total seats</p>
            </div>
            <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-emerald-50 dark:bg-emerald-950 text-emerald-600 dark:text-emerald-400 flex items-center justify-center shrink-0">
              <svg class="w-4 h-4 sm:w-5 sm:h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></svg>
            </div>
          </div>

          <div class="bg-white dark:bg-slate-900 rounded-2xl p-3 sm:p-4 border border-slate-200 dark:border-slate-800 shadow-xs flex items-center justify-between gap-2 transition-colors">
            <div class="min-w-0">
              <p class="text-[11px] sm:text-xs font-semibold text-slate-500 dark:text-slate-400 truncate">Assigned</p>
              <p class="text-xl sm:text-2xl font-extrabold text-indigo-600 dark:text-indigo-400 mt-0.5 leading-none">${summary.totalOccupied}</p>
              <p class="text-[10px] sm:text-[11px] text-slate-400 dark:text-slate-500 mt-1 truncate">Drivers &amp; riders</p>
            </div>
            <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 flex items-center justify-center shrink-0">
              <svg class="w-4 h-4 sm:w-5 sm:h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            </div>
          </div>

          <div class="bg-white dark:bg-slate-900 rounded-2xl p-3 sm:p-4 border border-slate-200 dark:border-slate-800 shadow-xs flex items-center justify-between gap-2 transition-colors">
            <div class="min-w-0">
              <p class="text-[11px] sm:text-xs font-semibold text-slate-500 dark:text-slate-400 truncate">Interested / Maybe</p>
              <p class="text-xl sm:text-2xl font-extrabold text-amber-600 dark:text-amber-400 mt-0.5 leading-none">${summary.totalInterested}</p>
              <p class="text-[10px] sm:text-[11px] text-slate-400 dark:text-slate-500 mt-1 truncate">Not 100% sure yet</p>
            </div>
            <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-amber-50 dark:bg-amber-950 text-amber-600 dark:text-amber-400 flex items-center justify-center shrink-0">
              <svg class="w-4 h-4 sm:w-5 sm:h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
            </div>
          </div>
        `;
      }

      // 2. Update Tab Labels & Styles
      const tabCarsBtn = document.getElementById('tabCarsBtn');
      const tabManifestBtn = document.getElementById('tabManifestBtn');
      const tabCarsLabel = document.getElementById('tabCarsLabel');
      const tabManifestLabel = document.getElementById('tabManifestLabel');

      if (tabCarsLabel) tabCarsLabel.textContent = `Vehicles (${state.cars.length})`;
      if (tabManifestLabel)
        tabManifestLabel.textContent = `Passengers (${summary.allPassengers.length})`;

      if (tabCarsBtn && tabManifestBtn) {
        if (state.activeTab === 'cars') {
          tabCarsBtn.className =
            'inline-flex items-center justify-center gap-1.5 sm:gap-2 px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all bg-white dark:bg-slate-900 text-indigo-600 dark:text-indigo-400 shadow-xs truncate';
          tabManifestBtn.className =
            'inline-flex items-center justify-center gap-1.5 sm:gap-2 px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white truncate';
        } else {
          tabManifestBtn.className =
            'inline-flex items-center justify-center gap-1.5 sm:gap-2 px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all bg-white dark:bg-slate-900 text-indigo-600 dark:text-indigo-400 shadow-xs truncate';
          tabCarsBtn.className =
            'inline-flex items-center justify-center gap-1.5 sm:gap-2 px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white truncate';
        }
      }

      // 3. Render Main Content Area
      const mainEl = document.getElementById('mainViewArea');
      if (!mainEl) return;

      if (state.loading) {
        mainEl.innerHTML = `
          <div class="bg-white dark:bg-slate-900 rounded-3xl p-12 border border-slate-200 dark:border-slate-800 text-center space-y-3">
            <div class="w-12 h-12 rounded-2xl bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 flex items-center justify-center mx-auto animate-pulse">
              <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>
            </div>
            <p class="text-base font-bold text-slate-800 dark:text-slate-100">Syncing live carpool lineup...</p>
            <p class="text-xs text-slate-500 dark:text-slate-400">Connecting to real-time seat assignment board</p>
          </div>
        `;
        return;
      }

      if (state.cars.length === 0) {
        mainEl.innerHTML = `
          <div class="bg-white dark:bg-slate-900 rounded-3xl p-8 sm:p-12 border border-slate-200 dark:border-slate-800 text-center max-w-2xl mx-auto my-4 shadow-sm space-y-5">
            <div class="w-16 h-16 rounded-3xl bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 flex items-center justify-center mx-auto shadow-inner">
              <svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>
            </div>
            <div class="space-y-2">
              <h2 class="text-xl sm:text-2xl font-extrabold text-slate-900 dark:text-white">No Carpool Vehicles Added Yet</h2>
            </div>
            <div class="flex flex-wrap items-center justify-center gap-3 pt-2">
              <button
                type="button"
                onclick="window.appActions.openAddCarModal()"
                class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold shadow-md shadow-indigo-100 dark:shadow-none transition-all"
              >
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
                <span>Add First Vehicle</span>
              </button>
            </div>
          </div>
        `;
        return;
      }

      const q = state.searchQuery.trim().toLowerCase();
      const filteredCars = !q
        ? state.cars
        : state.cars.filter((car) => {
            const pattern = formatLayoutPattern(getCarLayoutRows(car));
            if (car.name?.toLowerCase().includes(q)) return true;
            if (pattern.toLowerCase().includes(q)) return true;
            if (car.note?.toLowerCase().includes(q)) return true;
            if (car.pickupLocation?.toLowerCase().includes(q)) return true;
            if (car.departureTime?.toLowerCase().includes(q)) return true;
            const seats = car.seats || {};
            return Object.values(seats).some(
              (s) => s?.name?.toLowerCase().includes(q) || s?.note?.toLowerCase().includes(q)
            );
          });

      if (state.activeTab === 'cars') {
        const cardsHtml = filteredCars
          .map((car) => {
            const theme = CAR_THEMES[car.colorTheme] || CAR_THEMES.indigo;
            const layoutRows = getCarLayoutRows(car);
            const layoutPattern = formatLayoutPattern(layoutRows);
            const seatDefs = getSeatsForLayout(layoutRows);
            const totalCapacity = seatDefs.length;
            const activeSeatIds = new Set(seatDefs.map((d) => d.id));
            const seats = car.seats || {};
            const occupiedCount = seatDefs.filter(
              (s) => seats[s.id]?.name && seats[s.id].name.trim() !== ''
            ).length;
            const availableCount = Math.max(0, totalCapacity - occupiedCount);
            const isRHD = (car.driveSide || 'RHD') === 'RHD';
            const isQuickPickerOpen = state.quickLayoutCarId === car.id;

            const rowsGrouped = layoutRows.map((_, rIdx) => {
              const rowNum = rIdx + 1;
              const rowSeats = seatDefs.filter((s) => s.row === rowNum);
              if (rowNum === 1 && isRHD) return [...rowSeats].reverse();
              return rowSeats;
            });

            const overflowEntries = Object.entries(seats).filter(
              ([seatKey, sData]) =>
                !activeSeatIds.has(seatKey) && sData?.name && sData.name.trim() !== ''
            );

            const rowsHtml = rowsGrouped
              .map((rowSeats, rIdx) => {
                const rowNum = rIdx + 1;
                const seatsInRow = rowSeats.length;
                const totalRows = rowsGrouped.length;
                const isCaptainRowWithAisle =
                  rowNum === 2 && seatsInRow === 2 && totalRows >= 3;

                const rowTitle =
                  rowNum === 1
                    ? `Row 1 • Front (${seatsInRow} ${seatsInRow === 1 ? 'Seat' : 'Seats'})`
                    : isCaptainRowWithAisle
                    ? 'Row 2 • Captain Chairs (2 Seats + Aisle)'
                    : rowNum === totalRows
                    ? `Row ${rowNum} • Rear Row (${seatsInRow} ${
                        seatsInRow === 1 ? 'Seat' : 'Seats'
                      })`
                    : `Row ${rowNum} • Middle Row (${seatsInRow} ${
                        seatsInRow === 1 ? 'Seat' : 'Seats'
                      })`;

                let rowGridHtml = '';
                if (isCaptainRowWithAisle) {
                  rowGridHtml = `
                    <div class="grid grid-cols-7 gap-2 items-stretch">
                      <div class="col-span-3">${renderSeatButtonHtml(car, rowSeats[0], theme)}</div>
                      <div class="col-span-1 flex flex-col items-center justify-center rounded-xl border border-dashed border-slate-300/80 dark:border-slate-700 bg-slate-100/60 dark:bg-slate-800/50 py-2 px-0.5 text-center">
                        <span class="text-[8px] font-extrabold uppercase tracking-tighter text-slate-400 vertical-aisle-text">AISLE</span>
                      </div>
                      <div class="col-span-3">${renderSeatButtonHtml(car, rowSeats[1], theme)}</div>
                    </div>
                  `;
                } else if (seatsInRow === 1) {
                  rowGridHtml = `<div class="max-w-[170px] mx-auto">${renderSeatButtonHtml(
                    car,
                    rowSeats[0],
                    theme
                  )}</div>`;
                } else if (seatsInRow === 2) {
                  rowGridHtml = `<div class="grid grid-cols-2 gap-6 sm:gap-8 items-stretch ${
                    rowNum >= 3 ? 'px-2' : ''
                  }">${rowSeats.map((s) => renderSeatButtonHtml(car, s, theme)).join('')}</div>`;
                } else if (seatsInRow === 3) {
                  rowGridHtml = `<div class="grid grid-cols-3 gap-2 sm:gap-2.5 items-stretch">${rowSeats

                } else {
                  rowGridHtml = `<div class="grid grid-cols-4 gap-1.5 sm:gap-2 items-stretch">${rowSeats
                    .map((s) => renderSeatButtonHtml(car, s, theme))
                    .join('')}</div>`;
                }

                return `
                  <div class="mb-4 last:mb-3">
                    <div class="flex items-center justify-between mb-1.5 px-1">
                      <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400">${escapeHtml(
                        rowTitle
                      )}</span>
                      <span class="text-[10px] text-slate-400">${
                        rowNum === 1
                          ? isRHD
                            ? 'Right-Hand Drive'
                            : 'Left-Hand Drive'
                          : rowSeats.map((s) => s.shortLabel).join(' • ')
                      }</span>
                    </div>
                    ${rowGridHtml}
                  </div>

              .join('');

            const footerPillsHtml = seatDefs
              .map((seatDef) => {
                const s = seats[seatDef.id];
                if (!s?.name?.trim()) return '';
                const pillStyle = seatDef.isDriver
                  ? 'bg-slate-900 dark:bg-slate-800 text-white border border-transparent dark:border-slate-700'
                  : s.status === 'interested'
                  ? 'bg-amber-100 dark:bg-amber-950/80 text-amber-900 dark:text-amber-200 border border-amber-300 dark:border-amber-800'
                  : 'bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-200';
                return `
                  <button
                    type="button"
                    onclick="window.appActions.openSeatModal('${escapeHtml(car.id)}', '${escapeHtml(
                  seatDef.id

                    <span class="text-[10px] opacity-75">${escapeHtml(seatDef.shortLabel)}:</span>

                      <button

                      </button>

                    car.note

                        <div class="px-3.5 py-2.5 rounded-2xl ${theme.lightBg} border ${

                          } shrink-0 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                          <p class="leading-relaxed">${escapeHtml(car.note)}</p>

                      : ''

                <!-- Car Chassis Interior -->
                <div class="p-4 sm:p-6 bg-slate-50/70 dark:bg-slate-950/50 flex-1 flex flex-col items-center justify-center">
                  <div class="relative w-full max-w-[400px] mx-auto">
                    <div class="absolute top-16 -left-3 w-3 h-7 rounded-l-xl border-2 border-r-0 ${
                      theme.bodyBorder
                    } bg-white dark:bg-slate-800 shadow-sm"></div>
                    <div class="absolute top-16 -right-3 w-3 h-7 rounded-r-xl border-2 border-l-0 ${
                      theme.bodyBorder
                    } bg-white dark:bg-slate-800 shadow-sm"></div>

                    <div class="absolute top-12 -left-1.5 w-1.5 h-12 bg-slate-800 dark:bg-slate-600 rounded-l-md"></div>
                    <div class="absolute top-12 -right-1.5 w-1.5 h-12 bg-slate-800 dark:bg-slate-600 rounded-r-md"></div>
                    <div class="absolute bottom-14 -left-1.5 w-1.5 h-12 bg-slate-800 dark:bg-slate-600 rounded-l-md"></div>
                    <div class="absolute bottom-14 -right-1.5 w-1.5 h-12 bg-slate-800 dark:bg-slate-600 rounded-r-md"></div>

                  ${
                    overflowEntries.length > 0
                      ? `

                              .map(

                                    <span class="font-bold text-slate-900">${escapeHtml(

                                  <div class="flex items-center gap-1 shrink-0">
                                    ${
                                      availableCount > 0

        mainEl.innerHTML = `<section class="grid grid-cols-1 lg:grid-cols-2 gap-6">${cardsHtml}</section>`;
      } else {

                        <img
                          src="${escapeHtml(state.photoModalUrl)}"

                      <img

    // ==========================================
    // GLOBAL UI ACTIONS (Attached to window.appActions)

    window.appActions = {
      toggleBgm: () => {
        soundEngine.toggleBgm();

      toggleSfx: () => {
        state.sfxEnabled = !state.sfxEnabled;
        localStorage.setItem('electrizen_sfx_enabled', state.sfxEnabled ? 'true' : 'false');
        if (state.sfxEnabled) {
          soundEngine.playSfx('seat');
        }
        updateAudioUI();
      },

      toggleDarkMode: () => {
        state.darkMode = !state.darkMode;

        applyDarkModeUI();
      },

      setQuickName: (val) => {
        state.myQuickName = val;
        const input = document.getElementById('quickNameInput');
        if (input && input.value !== val) input.value = val;
        const clearBtn = document.getElementById('clearQuickNameBtn');

        state.activeTab = tab;
        renderApp();
      },

      setSearch: (val) => {
        state.searchQuery = val;

        const clearBtn = document.getElementById('clearSearchBtn');

          clearBtn.className = val

            : 'hidden';
        renderApp();
      },

      toggleQuickLayout: (carId) => {
        state.quickLayoutCarId = state.quickLayoutCarId === carId ? null : carId;
        renderApp();
      },

      closeModal: () => {
        state.activeModal = null;
        renderModals();
      },

      openAddCarModal: () => {
        state.carModal = {
          mode: 'add',
          carId: null,
          name: '',
          driverName: state.myQuickName || '',
          departureTime: '',
          pickupLocation: '',
          note: '',
          imageUrl: '',
          qrCodeUrl: '',
          colorTheme: 'indigo',
          driveSide: 'RHD',
          layoutRows: [2, 3, 2],
          isCustomLayout: false,
          verificationCode: ''
        };
        state.activeModal = 'car';
        renderModals();
      },

      openEditCarModal: (carId, openCustom = false) => {
        const car = state.cars.find((c) => c.id === carId);
        if (!car) return;
        const currentRows = getCarLayoutRows(car);
        const pattern = formatLayoutPattern(currentRows);
        const matchesPreset = LAYOUT_PRESETS.some((p) => p.id === pattern);

        state.quickLayoutCarId = null;
        state.carModal = {
          mode: 'edit',
          carId: car.id,
          name: car.name || '',
          driverName: car.seats?.driver?.name || '',
          departureTime: car.departureTime || '',
          pickupLocation: car.pickupLocation || '',
          note: car.note || '',
          imageUrl: car.imageUrl || '',
          qrCodeUrl: car.qrCodeUrl || '',
          colorTheme: car.colorTheme || 'indigo',
          driveSide: car.driveSide || 'RHD',
          layoutRows: currentRows,
          isCustomLayout: openCustom || !matchesPreset,
          verificationCode: ''
        };
        state.activeModal = 'car';
        renderApp();
        renderModals();
      },

      updateCarField: (field, value, rerender = false) => {
        state.carModal[field] = value;
        if (rerender) renderModals();
      },

      handleCarPhotoUpload: (event, photoType = 'car') => {
        const file = event.target?.files?.[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) {
          showToast('Please select a valid image file.', 'error');
          return;
        }

        const isQr = photoType === 'qr';
        const reader = new FileReader();
        reader.onload = (loadEvent) => {
          const img = new Image();
          img.onload = () => {
            // Compress & resize image automatically so both photos store smoothly in Firestore's 1MB limit
            const MAX_WIDTH = isQr ? 650 : 800;
            const MAX_HEIGHT = isQr ? 650 : 520;
            let width = img.width;
            let height = img.height;

            if (width > MAX_WIDTH || height > MAX_HEIGHT) {
              const ratio = Math.min(MAX_WIDTH / width, MAX_HEIGHT / height);
              width = Math.round(width * ratio);
              height = Math.round(height * ratio);
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            // Fill white background so transparent QR PNGs remain crisp and scannable
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, width, height);
            ctx.drawImage(img, 0, 0, width, height);

            const quality = isQr ? 0.84 : 0.72;
            const compressedDataUrl = canvas.toDataURL('image/jpeg', quality);
            if (isQr) {
              state.carModal.qrCodeUrl = compressedDataUrl;
              showToast('Payment QR code attached!');
            } else {
              state.carModal.imageUrl = compressedDataUrl;
              showToast('Car photo attached!');
            }
            renderModals();
          };
          img.onerror = () => {
            showToast('Could not process that image file.', 'error');
          };
          img.src = loadEvent.target.result;
        };
        reader.readAsDataURL(file);
      },

      clearCarPhoto: (photoType = 'car') => {
        if (photoType === 'qr') {
          state.carModal.qrCodeUrl = '';
        } else {
          state.carModal.imageUrl = '';
        }
        renderModals();
      },

      openPhotoModal: (carId, photoType = 'car') => {
        const car = state.cars.find((c) => c.id === carId);
        if (!car) return;
        const isQr = photoType === 'qr';
        const targetUrl = isQr ? car.qrCodeUrl : car.imageUrl;
        if (!targetUrl) return;
        state.photoModalUrl = targetUrl;
        state.photoModalTitle = isQr ? `${car.name} — Payment QR` : car.name;
        state.photoModalIsQr = isQr;
        state.activeModal = 'photo';
        renderModals();
      },

      toggleCustomBuilder: () => {
        state.carModal.isCustomLayout = !state.carModal.isCustomLayout;
        renderModals();
      },

      selectLayoutPreset: (presetId) => {
        const preset = LAYOUT_PRESETS.find((p) => p.id === presetId);
        if (!preset) return;
        state.carModal.layoutRows = [...preset.rows];
        state.carModal.isCustomLayout = false;
        renderModals();
      },

      addCustomRow: () => {
        if (state.carModal.layoutRows.length < 4) {
          state.carModal.layoutRows.push(3);
          renderModals();
        }
      },

      removeCustomRow: () => {
        if (state.carModal.layoutRows.length > 1) {
          state.carModal.layoutRows.pop();
          renderModals();
        }
      },

      setCustomRowSeats: (rIdx, count) => {
        state.carModal.layoutRows[rIdx] = count;
        renderModals();
      },

      saveCarForm: async (e) => {
        e.preventDefault();
        if (!state.user || !state.db) {
          showToast('Please connect Firebase first to save cars.', 'error');
          return;
        }
        const cm = state.carModal;
        if ((cm.verificationCode || '').trim().toUpperCase() !== OWNER_VERIFICATION_CODE) {
          showToast('Invalid Car Owner Verification Code! Only verified owners can add/edit cars.', 'error');
          return;
        }
        const trimmedName = cm.name.trim();
        if (!trimmedName) {
          showToast('Please enter a car name.', 'error');
          return;
        }

        const sanitizedRows = (cm.layoutRows || [2, 3, 2]).map((n) =>
          Math.min(4, Math.max(1, Number(n) || 1))
        );
        const layoutType = formatLayoutPattern(sanitizedRows);
        const currentWeekKey = getCurrentWeekInfo().weekKey;

        try {
          if (cm.mode === 'add') {
            const carsCol = collection(
              state.db,
              'artifacts',
              appId,
              'public',
              'data',
              'carpool_cars'
            );
            await addDoc(carsCol, {
              name: trimmedName,
              departureTime: cm.departureTime.trim(),
              pickupLocation: cm.pickupLocation.trim(),
              note: cm.note.trim(),
              imageUrl: (cm.imageUrl || '').trim(),
              qrCodeUrl: (cm.qrCodeUrl || '').trim(),
              colorTheme: cm.colorTheme || 'indigo',
              driveSide: cm.driveSide || 'RHD',
              layoutRows: sanitizedRows,
              layoutType,
              weekKey: currentWeekKey,
              createdAt: Date.now(),
              createdBy: state.user.uid,
              seats: createEmptySeats(cm.driverName, sanitizedRows)
            });
            showToast(`Added "${trimmedName}" (${layoutType} layout)!`);
          } else if (cm.mode === 'edit' && cm.carId) {
            const carRef = doc(
              state.db,
              'artifacts',
              appId,
              'public',
              'data',
              'carpool_cars',
              cm.carId
            );
            const existingCar = state.cars.find((c) => c.id === cm.carId);
            const { updatedSeats } = reconcileSeatsForNewLayout(
              existingCar?.seats || {},
              sanitizedRows,
              cm.driverName
            );
            await updateDoc(carRef, {
              name: trimmedName,
              departureTime: cm.departureTime.trim(),
              pickupLocation: cm.pickupLocation.trim(),
              note: cm.note.trim(),
              imageUrl: (cm.imageUrl || '').trim(),
              qrCodeUrl: (cm.qrCodeUrl || '').trim(),
              colorTheme: cm.colorTheme || 'indigo',
              driveSide: cm.driveSide || 'RHD',
              layoutRows: sanitizedRows,
              layoutType,
              seats: updatedSeats
            });
            showToast(`Updated "${trimmedName}" (${layoutType})!`);
          }
          state.activeModal = null;
          renderModals();
        } catch (err) {
          console.error('Error saving car:', err);
          showToast('Failed to save vehicle.', 'error');
        }
      },

      quickSwitchLayout: async (carId, presetId) => {
        if (!state.user || !state.db) return;
        const car = state.cars.find((c) => c.id === carId);
        const preset = LAYOUT_PRESETS.find((p) => p.id === presetId);
        if (!car || !preset) return;

        try {
          const carRef = doc(
            state.db,
            'artifacts',
            appId,
            'public',
            'data',
            'carpool_cars',
            car.id
          );
          const { updatedSeats, relocatedCount } = reconcileSeatsForNewLayout(
            car.seats || {},
            preset.rows,
            null
          );
          await updateDoc(carRef, {
            layoutRows: [...preset.rows],
            layoutType: preset.id,
            seats: updatedSeats
          });
          state.quickLayoutCarId = null;
          renderApp();
          showToast(
            `Switched "${car.name}" to ${preset.badge}${
              relocatedCount > 0 ? ` (${relocatedCount} moved to open seat)` : ''
            }!`
          );
        } catch (err) {
          console.error('Error switching layout:', err);
          showToast('Failed to switch layout.', 'error');
        }
      },

      openSeatModal: (carId, seatId) => {
        const car = state.cars.find((c) => c.id === carId);
        if (!car) return;
        soundEngine.playSfx('seat');
        const seatDefs = getSeatsForLayout(getCarLayoutRows(car));
        const seatDef = seatDefs.find((s) => s.id === seatId) || {
          id: seatId,
          label: 'Overflow Rider',
          shortLabel: 'OVF',
          position: 'Overflow Seat',
          description: 'Passenger from previous layout',
          isDriver: false
        };
        const currentSeat = car.seats?.[seatId] || { name: '', note: '', status: 'confirmed' };
        const prefilledName =
          currentSeat.name && currentSeat.name.trim() !== ''
            ? currentSeat.name
            : state.myQuickName.trim();

        state.seatModal = {
          carId: car.id,
          carName: car.name,
          seatDef,
          name: prefilledName,
          note: currentSeat.note || '',
          status: currentSeat.status || 'confirmed'
        };
        state.activeModal = 'seat';
        renderModals();
        setTimeout(() => {

          if (inp) inp.focus();
        }, 50);
      },

      updateSeatField: (field, val, rerender = false) => {
        state.seatModal[field] = val;
        if (rerender) renderModals();
      },

      saveSeatForm: async (e) => {
        e.preventDefault();
        if (!state.user || !state.db) return;
        const sm = state.seatModal;
        const trimmedName = sm.name.trim();
        const trimmedNote = sm.note.trim();

            state.db,
            'artifacts',
            appId,
            'public',
            'data',
            'carpool_cars',
            sm.carId
          );
          await updateDoc(carRef, {
            [`seats.${sm.seatDef.id}`]: {
              name: trimmedName,
              note: trimmedName ? trimmedNote : '',
              status: sm.status || 'confirmed',
              updatedBy: state.user.uid,
              updatedAt: Date.now()
            }
          });

          if (trimmedName && !state.myQuickName) {
            window.appActions.setQuickName(trimmedName);
          }
          state.activeModal = null;
          renderModals();
          showToast(
            trimmedName
              ? `Assigned ${trimmedName} to ${sm.seatDef.label}!`
              : `Cleared ${sm.seatDef.label}.`
          );
        } catch (err) {
          console.error('Error saving seat:', err);
          showToast('Failed to update seat.', 'error');
        }
      },

      vacateSeat: async () => {
        if (!state.user || !state.db) return;
        const sm = state.seatModal;
        try {
          const carRef = doc(
            state.db,
            'artifacts',
            appId,
            'public',
            'data',
            'carpool_cars',
            sm.carId
          );
          await updateDoc(carRef, {
            [`seats.${sm.seatDef.id}`]: {
              name: '',
              note: '',
              status: 'confirmed',
              updatedBy: state.user.uid,
              updatedAt: Date.now()
            }
          });
          state.activeModal = null;
          renderModals();
          soundEngine.playSfx('clear');
          showToast(`Vacated ${sm.seatDef.label}.`);
        } catch (err) {
          console.error('Error vacating seat:', err);
          showToast('Failed to vacate seat.', 'error');
        }
      },

      relocateOverflow: async (carId, oldSeatKey) => {
        if (!state.user || !state.db) return;
        const car = state.cars.find((c) => c.id === carId);
        if (!car) return;
        const seatDefs = getSeatsForLayout(getCarLayoutRows(car));
        const seats = { ...(car.seats || {}) };
        const passengerData = seats[oldSeatKey];
        if (!passengerData) return;

        const firstOpenDef = seatDefs.find(
          (def) => !def.isDriver && (!seats[def.id]?.name || seats[def.id].name.trim() === '')
        );
        if (!firstOpenDef) {
          showToast('No open seats available in this car!', 'error');
          return;
        }

        try {
          seats[firstOpenDef.id] = { ...passengerData, updatedAt: Date.now() };
          delete seats[oldSeatKey];
          const carRef = doc(
            state.db,
            'artifacts',
            appId,
            'public',
            'data',
            'carpool_cars',
            car.id
          );
          await updateDoc(carRef, { seats });
          showToast(`Moved ${passengerData.name} into ${firstOpenDef.label}!`);
        } catch (err) {
          console.error('Error relocating passenger:', err);
          showToast('Failed to move passenger.', 'error');
        }
      },

      clearCarSeats: (carId) => {
        const car = state.cars.find((c) => c.id === carId);

        state.confirmModal = {
          title: `Reset all passenger seats in "${car.name}"?`,
          message:
            'This will clear all passenger seats in this car while keeping the car details, layout, and driver intact.',
          confirmLabel: 'Clear Passenger Seats',
          confirmStyle: 'warning',
          onConfirm: async () => {
            if (!state.user || !state.db) return;
            const carRef = doc(
              state.db,
              'artifacts',
              appId,
              'public',
              'data',
              'carpool_cars',
              car.id
            );
            const driverKeep = car.seats?.driver?.name || '';
            await updateDoc(carRef, {
              seats: createEmptySeats(driverKeep, getCarLayoutRows(car))
            });
            showToast(`Cleared passenger seats in "${car.name}".`);
          }
        };
        state.activeModal = 'confirm';
        renderModals();
      },

      deleteCar: (carId) => {
        const car = state.cars.find((c) => c.id === carId);
        if (!car) return;
        state.confirmModal = {
          title: `Delete "${car.name}"?`,
          message:
            'This will permanently remove this vehicle and all passenger seat assignments inside it for everyone.',
          confirmLabel: 'Delete Car',
          confirmStyle: 'danger',
          onConfirm: async () => {
            if (!state.user || !state.db) return;
            const carRef = doc(
              state.db,
              'artifacts',
              appId,
              'public',
              'data',
              'carpool_cars',
              car.id
            );
            await deleteDoc(carRef);
            showToast(`Deleted "${car.name}".`);
          }
        };
        state.activeModal = 'confirm';
        renderModals();
      },

      runConfirm: async () => {
        const fn = state.confirmModal.onConfirm;
        state.activeModal = null;
        renderModals();
        if (fn) await fn();
      },

      seedSampleCars: async () => {
        if (!state.user || !state.db) return;
        try {
          const carsCol = collection(
            state.db,
            'artifacts',
            appId,
            'public',
            'data',
            'carpool_cars'
          );
          const now = Date.now();
          const currentWeekKey = getCurrentWeekInfo().weekKey;

          await addDoc(carsCol, {
            name: "Sarah's Toyota Highlander (2-3-2)",
            departureTime: '07:45 AM',
            pickupLocation: 'Central Station North Exit',
            note: 'Leaving sharp at 7:45 AM! 7-seat 2-3-2 layout, room for 4 backpacks.',
            colorTheme: 'indigo',
            driveSide: 'RHD',
            layoutRows: [2, 3, 2],
            layoutType: '2-3-2',
            weekKey: currentWeekKey,
            createdAt: now,
            createdBy: state.user.uid,
            seats: {
              driver: { name: 'Sarah Jenkins', note: 'Driver • Has toll pass', status: 'confirmed', updatedAt: now },
              front_pax: { name: 'Marcus Vance', note: 'Playlist DJ', status: 'confirmed', updatedAt: now },
              mid_left: { name: 'Elena Rostova', note: 'Pickup at Oak St', status: 'confirmed', updatedAt: now },
              mid_center: { name: '', note: '', status: 'confirmed', updatedAt: null },
              mid_right: { name: 'Devon Brooks', note: '1 small duffel', status: 'interested', updatedAt: now },
              back_left: { name: '', note: '', status: 'confirmed', updatedAt: null },
              back_right: { name: '', note: '', status: 'confirmed', updatedAt: null }
            }
          });

          await addDoc(carsCol, {
            name: "Kevin's Kia Carnival (Captain Chairs 2-2-3)",
            departureTime: '08:30 AM',
            pickupLocation: 'Westside Mall Lot B',
            note: '2nd row has two Captain Chairs with center aisle access to the 3-seat back bench!',
            colorTheme: 'emerald',
            driveSide: 'RHD',
            layoutRows: [2, 2, 3],
            layoutType: '2-2-3',
            weekKey: currentWeekKey,
            createdAt: now + 100,
            createdBy: state.user.uid,
            seats: {
              driver: { name: 'Kevin Park', note: 'Driver', status: 'confirmed', updatedAt: now },
              front_pax: { name: '', note: '', status: 'confirmed', updatedAt: null },
              mid_left: { name: 'Priya Patel', note: 'Bringing snacks!', status: 'confirmed', updatedAt: now },
              mid_right: { name: 'Lucas Meyer', note: 'Tentative on 8am call', status: 'interested', updatedAt: now },
              back_left: { name: '', note: '', status: 'confirmed', updatedAt: null },
              back_center: { name: '', note: '', status: 'confirmed', updatedAt: null },
              back_right: { name: '', note: '', status: 'confirmed', updatedAt: null }
            }
          });

          await addDoc(carsCol, {
            name: "Alex's Honda CR-V (5-Seat 2-3)",
            departureTime: '09:15 AM',
            pickupLocation: 'Downtown Coffee Roasters',
            note: 'Standard 5-seat (2-3) SUV. Fast highway route.',
            colorTheme: 'amber',
            driveSide: 'RHD',
            layoutRows: [2, 3],
            layoutType: '2-3',
            weekKey: currentWeekKey,
            createdAt: now + 200,
            createdBy: state.user.uid,
            seats: {
              driver: { name: 'Alex Rivera', note: 'Driver', status: 'confirmed', updatedAt: now },
              front_pax: { name: 'Hannah Kim', note: 'Confirmed shotgun', status: 'confirmed', updatedAt: now },
              mid_left: { name: '', note: '', status: 'confirmed', updatedAt: null },
              mid_center: { name: '', note: '', status: 'confirmed', updatedAt: null },
              mid_right: { name: '', note: '', status: 'confirmed', updatedAt: null }
            }
          });

          showToast('Loaded 3 sample cars (2-3-2, 2-2-3, and 2-3)!');
        } catch (err) {
          console.error('Error seeding cars:', err);
          showToast('Failed to load sample cars.', 'error');
        }
      },

      copySummary: () => {
        if (state.cars.length === 0) {
          showToast('No cars to copy yet!', 'error');
          return;
        }
        const lines = ['🚗 REAL-TIME CARPOOL ROSTER 🚗', ''];
        state.cars.forEach((car, idx) => {
          const layoutRows = getCarLayoutRows(car);
          const pattern = formatLayoutPattern(layoutRows);
          const seatDefs = getSeatsForLayout(layoutRows);
          const totalSeats = seatDefs.length;
          const seats = car.seats || {};
          const occupiedCount = seatDefs.filter(
            (s) => seats[s.id]?.name && seats[s.id].name.trim() !== ''
          ).length;
          const leftCount = Math.max(0, totalSeats - occupiedCount);

          lines.push(
            `${idx + 1}. ${car.name} [${totalSeats} Seats • ${pattern} Layout] (${occupiedCount}/${totalSeats} occupied • ${leftCount} left)`
          );
          if (car.departureTime || car.pickupLocation) {
            lines.push(
              `   📍 ${[car.departureTime, car.pickupLocation].filter(Boolean).join(' @ ')}`
            );
          }
          if (car.note) lines.push(`   📝 Note: ${car.note}`);

          seatDefs.forEach((seatDef) => {
            const s = seats[seatDef.id];
            const occupant = s?.name?.trim() ? s.name.trim() : '--- [OPEN SEAT] ---';
            const statusTag =
              s?.name?.trim() && s?.status === 'interested' ? ' (Interested / Maybe)' : '';
            const noteTag = s?.name?.trim() && s?.note ? ` - "${s.note}"` : '';
            lines.push(
              `   • [${seatDef.shortLabel}] ${seatDef.label}: ${occupant}${statusTag}${noteTag}`
            );
          });
          lines.push('');
        });

        const textArea = document.createElement('textarea');
        textArea.value = lines.join('\n');
        document.body.appendChild(textArea);
        textArea.select();
        try {
          document.execCommand('copy');
          showToast('Copied full carpool roster to clipboard!');
        } catch (err) {
          showToast('Failed to copy roster.', 'error');
        }
        document.body.removeChild(textArea);
      }
    };

    // ==========================================
    // INITIALIZE FIREBASE & REAL-TIME LISTENER
    // ==========================================
    // Global tactile button click listener for interactive sound effects
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('button, label, tr[onclick]');
      if (!btn) return;
      // Skip generic click sound if it's the BGM/SFX toggle or a seat button (which plays its own tone)
      if (btn.classList.contains('bgm-toggle-btn') || btn.classList.contains('sfx-toggle-btn')) return;
      const onclickAttr = btn.getAttribute('onclick') || '';
      if (onclickAttr.includes('openSeatModal')) return;
      soundEngine.playSfx('click');
    });

    const runSplashScreenTransition = () => {
      const splash = document.getElementById('splashScreen');
      if (!splash) return;

      // Show splash screen for ~1.5 seconds, then smoothly fade & scale out
      setTimeout(() => {
        splash.classList.add('opacity-0', 'scale-105', 'pointer-events-none');
        setTimeout(() => {
          if (splash && splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
        }, 720);
      }, 1500);
    };

    const initApplication = async () => {
      applyDarkModeUI();
      renderApp();
      runSplashScreenTransition();

      if (!firebaseConfig || !firebaseConfig.apiKey) {
        state.loading = false;
        const banner = document.getElementById('errorBanner');
        const bannerText = document.getElementById('errorBannerText');
        if (banner && bannerText) {
          banner.classList.remove('hidden');
          bannerText.innerHTML =
            '<strong>External Hosting Setup Needed:</strong> Paste your free Firebase project config into <code>YOUR_OWN_FIREBASE_CONFIG</code> inside <code>index.html</code> to enable real-time database sync on your custom URL.';
        }
        renderApp();
        return;
      }

      try {
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        state.db = db;

        // Rule 3: Authenticate FIRST before any Firestore query
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }

        onAuthStateChanged(auth, (currentUser) => {
          state.user = currentUser;
          const footerEl = document.getElementById('sessionFooterId');
          if (footerEl) {
            footerEl.textContent = `Session ID: ${currentUser ? currentUser.uid : 'Disconnected'}`;
          }

          if (!currentUser) return;

          // Rule 1 & Rule 2: Strict path & simple collection query
          const carsColRef = collection(
            db,
            'artifacts',
            appId,
            'public',
            'data',
            'carpool_cars'
          );

          onSnapshot(
            carsColRef,
            (snapshot) => {
              const loaded = snapshot.docs.map((docSnap) => ({
                id: docSnap.id,
                ...docSnap.data()
              }));
              loaded.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

              // Automatic Weekly Seat Reset (Every Monday at 00:00)
              const { weekKey: currentWeekKey, weekStartMs } = getCurrentWeekInfo();
              loaded.forEach((car) => {
                const isFromPreviousWeek =
                  (car.weekKey && car.weekKey !== currentWeekKey) ||
                  (!car.weekKey && car.createdAt && car.createdAt < weekStartMs);

                const carRef = doc(
                  db,
                  'artifacts',
                  appId,
                  'public',
                  'data',
                  'carpool_cars',
                  car.id
                );

                if (isFromPreviousWeek) {
                  const driverKeep = car.seats?.driver?.name || '';
                  const resetSeats = createEmptySeats(driverKeep, getCarLayoutRows(car));
                  car.seats = resetSeats;
                  car.weekKey = currentWeekKey;
                  updateDoc(carRef, {
                    seats: resetSeats,
                    weekKey: currentWeekKey,
                    lastWeeklyResetAt: Date.now()
                  }).catch((e) => console.error('Weekly seat reset error:', e));
                } else if (!car.weekKey) {
                  car.weekKey = currentWeekKey;
                  updateDoc(carRef, { weekKey: currentWeekKey }).catch(() => {});
                }
              });

              state.cars = loaded;
              state.loading = false;
              state.isCloudConnected = true;
              renderApp();
            },
            (err) => {
              console.error('Firestore listener error:', err);
              state.loading = false;
              const banner = document.getElementById('errorBanner');
              const bannerText = document.getElementById('errorBannerText');
              if (banner && bannerText) {
                banner.classList.remove('hidden');
                bannerText.innerHTML =
                  '<strong>Database Permission Needed:</strong> In your Firebase Console, go to <strong>Build &rarr; Firestore Database</strong>, create the database in <strong>Test mode</strong>, and publish the rules.';
              }
              renderApp();
            }
          );
        });
      } catch (err) {
        console.error('Firebase initialization error:', err);
        state.loading = false;
        const banner = document.getElementById('errorBanner');
        const bannerText = document.getElementById('errorBannerText');
        if (banner && bannerText) {
          banner.classList.remove('hidden');
          bannerText.innerHTML =
            '<strong>One Last Firebase Toggle:</strong> In your Firebase Console, click <strong>Build &rarr; Authentication &rarr; Get started &rarr; Anonymous &rarr; Enable &rarr; Save</strong>, then refresh this page.';
        }
        renderApp();
      }
    };

    window.addEventListener('DOMContentLoaded', initApplication);
  </script>
