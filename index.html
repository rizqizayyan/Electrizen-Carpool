<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Electrizen Carpool</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    };
  </script>
  <!-- Tone.js for Interactive Sound Effects & Roadtrip Background Music -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .vertical-aisle-text {
      writing-mode: vertical-lr;
      transform: rotate(180deg);
    }
    /* Custom subtle scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    .dark ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    .dark ::-webkit-scrollbar-thumb {
      background: #334155;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    @keyframes eqBar1 {
      0%, 100% { height: 4px; }
      50% { height: 13px; }
    }
    @keyframes eqBar2 {
      0%, 100% { height: 12px; }
      50% { height: 4px; }
    }
    @keyframes eqBar3 {
      0%, 100% { height: 6px; }
      40% { height: 14px; }
      80% { height: 5px; }
    }
    .eq-bar-1 { animation: eqBar1 0.8s ease-in-out infinite; }
    .eq-bar-2 { animation: eqBar2 0.7s ease-in-out infinite; }
    .eq-bar-3 { animation: eqBar3 0.9s ease-in-out infinite; }

    /* Splash Screen & Page Entrance Animations */
    @keyframes splashProgressFill {
      0% { width: 0%; }
      45% { width: 62%; }
      85% { width: 92%; }
      100% { width: 100%; }
    }
    @keyframes splashCarDrive {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-2.5px) rotate(-1deg); }
    }
    @keyframes roadDashMove {
      0% { transform: translateX(0); }
      100% { transform: translateX(-28px); }
    }
    .splash-progress-bar {
      animation: splashProgressFill 1.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .splash-car-bounce {
      animation: splashCarDrive 0.65s ease-in-out infinite;
    }
    .road-dash-track {
      animation: roadDashMove 0.45s linear infinite;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 flex flex-col antialiased selection:bg-indigo-600 selection:text-white transition-colors duration-200">

  <!-- ==========================================
       ANIMATED LOADING SPLASH SCREEN (1.5s)
  =========================================== -->
  <div id="splashScreen" class="fixed inset-0 z-[100] bg-gradient-to-br from-slate-950 via-indigo-950 to-slate-900 flex flex-col items-center justify-center px-6 select-none transition-all duration-700 ease-out">
    <!-- Ambient Decorative Glow -->
    <div class="absolute w-72 h-72 sm:w-96 sm:h-96 rounded-full bg-indigo-500/20 blur-3xl pointer-events-none"></div>
    <div class="absolute w-48 h-48 rounded-full bg-emerald-500/10 blur-2xl pointer-events-none translate-x-20 -translate-y-16"></div>

    <!-- Center Emblem with Pulsing Rings -->

      <div class="absolute w-28 h-28 rounded-3xl bg-indigo-500/20 animate-ping" style="animation-duration: 1.8s;"></div>
      <div class="absolute w-24 h-24 rounded-3xl bg-indigo-500/30 animate-pulse"></div>
      <div class="relative w-20 h-20 rounded-3xl bg-gradient-to-br from-indigo-500 via-indigo-600 to-indigo-700 flex items-center justify-center text-white shadow-2xl shadow-indigo-500/50 border border-indigo-400/30">
        <svg class="w-10 h-10 splash-car-bounce" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/>
          <circle cx="7" cy="17" r="2"/>
          <path d="M9 17h6"/>
          <circle cx="17" cy="17" r="2"/>
        </svg>
      </div>
    </div>

    <!-- Title & Status Subtitle -->
    <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white text-center">
      Electrizen Carpool
    </h1>
    <p class="mt-2 text-xs sm:text-sm font-medium text-indigo-200/80 flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
      <span id="splashSubtitleText">Syncing real-time seats...</span>
    </p>

    <!-- Animated Road Track & Progress Bar -->
    <div class="mt-7 w-60 sm:w-72 space-y-2.5">
      <!-- Moving Road Dashes -->
      <div class="relative h-3 w-full overflow-hidden rounded-full bg-slate-900/80 border border-slate-800/90 flex items-center">
        <div class="flex items-center gap-3 road-dash-track px-2">
          <span class="w-4 h-0.5 rounded-full bg-amber-400/70 shrink-0"></span>
          <span class="w-4 h-0.5 rounded-full bg-amber-400/70 shrink-0"></span>
          <span class="w-4 h-0.5 rounded-full bg-amber-400/70 shrink-0"></span>
          <span class="w-4 h-0.5 rounded-full bg-amber-400/70 shrink-0"></span>
          <span class="w-4 h-0.5 rounded-full bg-amber-400/70 shrink-0"></span>
          <span class="w-4 h-0.5 rounded-full bg-amber-400/70 shrink-0"></span>
          <span class="w-4 h-0.5 rounded-full bg-amber-400/70 shrink-0"></span>
          <span class="w-4 h-0.5 rounded-full bg-amber-400/70 shrink-0"></span>
          <span class="w-4 h-0.5 rounded-full bg-amber-400/70 shrink-0"></span>
          <span class="w-4 h-0.5 rounded-full bg-amber-400/70 shrink-0"></span>
          <span class="w-4 h-0.5 rounded-full bg-amber-400/70 shrink-0"></span>
          <span class="w-4 h-0.5 rounded-full bg-amber-400/70 shrink-0"></span>
        </div>
      </div>

      <!-- Smooth Fill Progress Bar -->
      <div class="h-1.5 w-full rounded-full bg-slate-800/90 overflow-hidden p-0.5">
        <div class="h-full rounded-full bg-gradient-to-r from-indigo-400 via-emerald-400 to-indigo-400 splash-progress-bar"></div>
      </div>
    </div>
  </div>

  <!-- ==========================================
       FLOATING TOAST NOTIFICATION
  =========================================== -->
  <div id="toastContainer" class="hidden"></div>

  <!-- ==========================================
       TOP HEADER & REAL-TIME STATUS BAR
  =========================================== -->

    <div class="max-w-7xl mx-auto px-3.5 sm:px-6 lg:px-8 py-3 sm:py-3.5">
      <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-2.5 sm:gap-3">
        
        <!-- Row 1: Brand Identity + Primary Action Button on Mobile -->
        <div class="flex items-center justify-between gap-2 sm:gap-3 min-w-0">
          <div class="flex items-center gap-2.5 sm:gap-3 min-w-0 flex-1">
            <div class="w-9 h-9 sm:w-11 sm:h-11 rounded-2xl bg-gradient-to-br from-indigo-500 to-indigo-700 flex items-center justify-center text-white shadow-md shadow-indigo-500/20 shrink-0">
              <svg class="w-5 h-5 sm:w-6 sm:h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/>

                Resets Mon
              </span>
            </div>
          </div>

            type="button"
            onclick="window.appActions.openAddCarModal()"

            <input
              id="quickNameInput"
              type="text"
              placeholder="Your name for quick claim..."
              oninput="window.appActions.setQuickName(this.value)"
              class="bg-transparent text-xs sm:text-sm text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none w-full lg:w-44 min-w-0 truncate"
            />
            <button
              id="clearQuickNameBtn"
              type="button"
              onclick="window.appActions.setQuickName('')"
              class="hidden text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 ml-1 shrink-0"
              title="Clear name"
            >
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
          </div>

          <!-- Unified Pill Dock for Lang, Music, SFX & Dark Mode (Works cleanly on Mobile & Desktop) -->

              <svg class="w-3.5 h-3.5 text-indigo-600 dark:text-indigo-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>
              </svg>
              <span class="lang-label">EN</span>
            </button>

            <div class="w-px h-4 bg-slate-200 dark:bg-slate-700"></div>

            <button
              id="bgmToggleBtn"
              type="button"
              onclick="window.appActions.toggleBgm()"
              class="bgm-toggle-btn inline-flex items-center justify-center gap-1.5 px-2 py-1.5 rounded-lg text-slate-700 dark:text-slate-200 hover:bg-white dark:hover:bg-slate-700 text-xs font-semibold whitespace-nowrap transition-all"
              title="Play / Pause Chill Roadtrip Background Music"
            >
              <span class="bgm-icon flex items-center justify-center w-4 h-4 shrink-0"></span>
              <span class="bgm-label hidden xl:inline">Music Off</span>
            </button>

            <div class="w-px h-4 bg-slate-200 dark:bg-slate-700"></div>

            <button

              type="button"

              <span class="sfx-icon flex items-center justify-center w-4 h-4 shrink-0"></span>
              <span class="sfx-label hidden xl:inline">SFX On</span>

  <!-- ==========================================
       MAIN CONTENT CONTAINER
  =========================================== -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-3.5 sm:px-6 lg:px-8 py-4 sm:py-6 space-y-4 sm:space-y-6">
    <!-- Alert / Error Banner -->

        <svg class="w-5 h-5 text-amber-600 dark:text-amber-400 shrink-0 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

        <!-- Search Filter -->
        <div class="relative w-full sm:w-64 lg:order-3">

            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
          </svg>

            type="text"
            oninput="window.appActions.setSearch(this.value)"

            class="w-full pl-9 pr-8 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs sm:text-sm text-slate-900 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white dark:focus:bg-slate-800"
          />
          <button
            id="clearSearchBtn"
            type="button"
            onclick="window.appActions.setSearch('')"
            class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
          >
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>

      </div>

      <!-- Legend (Clean 4-pill bar on mobile & desktop) -->
      <div class="grid grid-cols-2 sm:flex sm:flex-wrap items-center gap-x-4 gap-y-1.5 text-[11px] sm:text-xs text-slate-600 dark:text-slate-400 pt-2 sm:pt-0 border-t sm:border-t-0 border-slate-100 dark:border-slate-800/80 px-1 lg:order-2">

    <!-- Dynamic Main View Area -->

    const t = (key, ...args) => {
      const lang = state?.lang === 'id' ? 'id' : 'en';
      const val = I18N[lang]?.[key] ?? I18N.en[key];
      return typeof val === 'function' ? val(...args) : val;
    };

    // Compute current Monday-based week identifier & date range for automatic weekly seat resets
    const getCurrentWeekInfo = () => {
      const now = new Date();
      const day = now.getDay(); // 0 (Sun) to 6 (Sat)
      const diffToMonday = day === 0 ? -6 : 1 - day;
      const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() + diffToMonday, 0, 0, 0, 0);
      const sunday = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 6, 23, 59, 59, 999);

      const year = monday.getFullYear();
      const month = String(monday.getMonth() + 1).padStart(2, '0');
      const date = String(monday.getDate()).padStart(2, '0');
      const weekKey = `${year}-M${month}-D${date}`;

      const locale = typeof state !== 'undefined' && state.lang === 'id' ? 'id-ID' : 'en-US';
      const fmt = (d) => d.toLocaleDateString(locale, { month: 'short', day: 'numeric' });
      return {
        weekKey,
        weekStartMs: monday.getTime(),
        rangeLabel: `${fmt(monday)} – ${fmt(sunday)}`
      };
    };

        try {
          const ctx = this.getAudioContext();
          if (!ctx) return;
          const now = ctx.currentTime;

          if (type === 'click') {
            // Crisp tactile button pop
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(520, now);
            osc.frequency.exponentialRampToValueAtTime(180, now + 0.045);

            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);

            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.05);
          } else if (type === 'seat') {
            // Soft upward two-tone pop when opening a seat
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(380, now);
            osc.frequency.exponentialRampToValueAtTime(640, now + 0.08);

            gain.gain.setValueAtTime(0.14, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.085);

            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);

            // Pleasant ascending major triad chime when claiming a seat or saving a car
            const notes = [523.25, 659.25, 783.99, 1046.5]; // C5, E5, G5, C6
            notes.forEach((freq, idx) => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'triangle';
              const startTime = now + idx * 0.055;
              osc.frequency.setValueAtTime(freq, startTime);

              gain.gain.setValueAtTime(0.11, startTime);
              gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.22);

              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(startTime);
              osc.stop(startTime + 0.23);

            // Soft descending two-note tone when vacating or deleting

            notes.forEach((freq, idx) => {
              const osc = ctx.createOscillator();

              const startTime = now + idx * 0.065;
              osc.frequency.setValueAtTime(freq, startTime);

              gain.gain.setValueAtTime(0.11, startTime);

              gain.connect(ctx.destination);

              envelope: { attack: 0.4, decay: 1.2, sustain: 0.6, release: 2.0 }
            }).connect(filter);
            this.padSynth.volume.value = -16;

            // Gentle plucked melody arpeggiator
            this.arpSynth = new Tone.Synth({
              oscillator: { type: 'triangle' },
              envelope: { attack: 0.02, decay: 0.3, sustain: 0.1, release: 0.6 }
            }).connect(reverb);
            this.arpSynth.volume.value = -18;

            // Soft warm sub-bass
            this.bassSynth = new Tone.Synth({
              oscillator: { type: 'sine' },
              envelope: { attack: 0.08, decay: 0.5, sustain: 0.5, release: 1.2 }
            }).toDestination();
            this.bassSynth.volume.value = -17;

            // Chill progression: Fmaj7 -> Em7 -> Dm7 -> Cmaj7
            const progression = [
              { chord: ['F3', 'A3', 'C4', 'E4'], bass: 'F2', arp: ['A4', 'C5', 'E5', 'C5'] },
              { chord: ['E3', 'G3', 'B3', 'D4'], bass: 'E2', arp: ['G4', 'B4', 'D5', 'B4'] },
              { chord: ['D3', 'F3', 'A3', 'C4'], bass: 'D2', arp: ['F4', 'A4', 'C5', 'A4'] },
              { chord: ['C3', 'E3', 'G3', 'B3'], bass: 'C2', arp: ['E4', 'G4', 'B4', 'G4'] }
            ];

            let stepIndex = 0;
            this.chordLoop = new Tone.Loop((time) => {
              const current = progression[stepIndex % progression.length];
              this.padSynth.triggerAttackRelease(current.chord, '1m', time);
              this.bassSynth.triggerAttackRelease(current.bass, '1m', time);

              // Schedule soft arpeggio notes across the bar
              current.arp.forEach((note, idx) => {
                this.arpSynth.triggerAttackRelease(
                  note,
                  '8n',
                  time + idx * Tone.Time('4n').toSeconds()
                );
              });

              stepIndex++;
            }, '1m').start(0);

            this.bgmInitialized = true;
          }

          if (state.bgmPlaying) {
            Tone.Transport.pause();
            state.bgmPlaying = false;
            this.playSfx('click');
          } else {
            Tone.Transport.start();
            state.bgmPlaying = true;
            this.playSfx('seat');
          }

          updateAudioUI();
        } catch (err) {
          console.error('Error toggling background music:', err);
        }
      }
    };

      const allPassengers = [];

      state.cars.forEach((car) => {

        const seatDefs = getSeatsForLayout(layoutRows);

        totalCapacity += seatDefs.length;

        const seats = car.seats || {};
        seatDefs.forEach((seatDef) => {
          const seatData = seats[seatDef.id];
          if (seatData && seatData.name && seatData.name.trim() !== '') {
            totalOccupied += 1;
            if (seatData.status === 'interested') totalInterested += 1;
            allPassengers.push({
              carId: car.id,
              carName: car.name,
              carLayout: formatLayoutPattern(layoutRows),
              carTheme: car.colorTheme || 'indigo',
              seatId: seatDef.id,
              seatLabel: seatDef.label,
              seatShort: seatDef.shortLabel,
              isDriver: seatDef.isDriver,
              passengerName: seatData.name.trim(),
              passengerNote: seatData.note || '',
              status: seatData.status || 'confirmed'
            });
          }
        });

        Object.entries(seats).forEach(([seatKey, seatData]) => {
          if (!activeIds.has(seatKey) && seatData?.name && seatData.name.trim() !== '') {
            totalOccupied += 1;
            if (seatData.status === 'interested') totalInterested += 1;
            allPassengers.push({
              carId: car.id,
              carName: car.name,
              carLayout: formatLayoutPattern(layoutRows),
              carTheme: car.colorTheme || 'indigo',
              seatId: seatKey,
              seatLabel: t('overflowNeedsSeat'),
              seatShort: 'OVF',
              isDriver: false,
              passengerName: seatData.name.trim(),
              passengerNote: seatData.note || '',
              status: seatData.status || 'confirmed'
            });
          }
        });
      });

      return {
        totalCars,
        totalCapacity,
        totalOccupied,
        totalAvailable: Math.max(0, totalCapacity - totalOccupied),
        totalInterested,
        allPassengers

            if (pattern.toLowerCase().includes(q)) return true;
            if (car.note?.toLowerCase().includes(q)) return true;
            if (car.pickupLocation?.toLowerCase().includes(q)) return true;
            if (car.departureTime?.toLowerCase().includes(q)) return true;
            const seats = car.seats || {};
            return Object.values(seats).some(

                  ? t('rowCaptainTitle')

                  ? t('rowRearTitle', rowNum, seatsInRow)

                    rowSeats[0],

                    rowNum >= 3 ? 'px-2' : ''

                } else if (seatsInRow === 3) {
                  rowGridHtml = `<div class="grid grid-cols-3 gap-2 sm:gap-2.5 items-stretch">${rowSeats

                                ${escapeHtml(t('payViewQr'))}

                                  ${escapeHtml(car.pickupLocation)}
                                 </span>`

                          }

                      >
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                      </button>
                      <button

                        onclick="window.appActions.clearCarSeats('${escapeHtml(car.id)}')"

                      <button

                        onclick="window.appActions.deleteCar('${escapeHtml(car.id)}')"

                      >
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>

      handleCarPhotoUpload: (event, photoType = 'car') => {
        const file = event.target?.files?.[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) {
          showToast(t('toastInvalidImage'), 'error');
          return;
        }

        const isQr = photoType === 'qr';
        const reader = new FileReader();
        reader.onload = (loadEvent) => {
          const img = new Image();
          img.onload = () => {
            // Compress & resize image automatically so both photos store smoothly in Firestore's 1MB limit
            const MAX_WIDTH = isQr ? 650 : 800;
            const MAX_HEIGHT = isQr ? 650 : 520;
            let width = img.width;
            let height = img.height;

            if (width > MAX_WIDTH || height > MAX_HEIGHT) {
              const ratio = Math.min(MAX_WIDTH / width, MAX_HEIGHT / height);
              width = Math.round(width * ratio);
              height = Math.round(height * ratio);
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            // Fill white background so transparent QR PNGs remain crisp and scannable
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, width, height);
            ctx.drawImage(img, 0, 0, width, height);

            const quality = isQr ? 0.84 : 0.72;
            const compressedDataUrl = canvas.toDataURL('image/jpeg', quality);
            if (isQr) {
              state.carModal.qrCodeUrl = compressedDataUrl;
              showToast(t('toastQrAttached'));
            } else {
              state.carModal.imageUrl = compressedDataUrl;
              showToast(t('toastCarPhotoAttached'));
            }
            renderModals();
          };
          img.onerror = () => {
            showToast(t('toastImageProcessErr'), 'error');
          };
          img.src = loadEvent.target.result;
        };
        reader.readAsDataURL(file);
      },

      clearCarPhoto: (photoType = 'car') => {
        if (photoType === 'qr') {
          state.carModal.qrCodeUrl = '';
        } else {
          state.carModal.imageUrl = '';
        }

        if (!targetUrl) return;
        state.photoModalUrl = targetUrl;
        state.photoModalTitle = isQr ? `${car.name} — ${t('paymentQrBadge')}` : car.name;

        renderModals();

      saveCarForm: async (e) => {
        e.preventDefault();
        if (!state.user || !state.db) {
          showToast(t('toastConnectFirebase'), 'error');
          return;
        }
        const cm = state.carModal;
        if ((cm.verificationCode || '').trim().toUpperCase() !== OWNER_VERIFICATION_CODE) {
          showToast(t('toastInvalidOwnerCode'), 'error');
          return;
        }
        const trimmedName = cm.name.trim();
        const isMoto = cm.vehicleType === 'motorcycle';
        const sanitizedRows = isMoto
          ? [1, 1]
          : (cm.layoutRows || [2, 3, 2]).map((n) =>
              Math.min(4, Math.max(1, Number(n) || 1))
            );
        const layoutType = formatLayoutPattern(sanitizedRows);
        const currentWeekKey = getCurrentWeekInfo().weekKey;

        try {
          if (cm.mode === 'add') {
            const carsCol = collection(
              state.db,
              'artifacts',
              appId,
              'public',
              'data',
              'carpool_cars'
            );
            await addDoc(carsCol, {
              name: trimmedName,
              vehicleType: isMoto ? 'motorcycle' : 'car',
              departureTime: cm.departureTime.trim(),
              pickupLocation: cm.pickupLocation.trim(),
              note: cm.note.trim(),
              imageUrl: (cm.imageUrl || '').trim(),
              qrCodeUrl: (cm.qrCodeUrl || '').trim(),
              colorTheme: cm.colorTheme || 'indigo',
              driveSide: cm.driveSide || 'RHD',
              layoutRows: sanitizedRows,
              layoutType,
              weekKey: currentWeekKey,
              createdAt: Date.now(),
              createdBy: state.user.uid,
              seats: createEmptySeats(cm.driverName, sanitizedRows)
            });
            showToast(t('toastAddedCar', trimmedName, layoutType));
          } else if (cm.mode === 'edit' && cm.carId) {
            const carRef = doc(
              state.db,
              'artifacts',
              appId,
              'public',
              'data',
              'carpool_cars',
              cm.carId
            );
            const existingCar = state.cars.find((c) => c.id === cm.carId);
            const { updatedSeats } = reconcileSeatsForNewLayout(
              existingCar?.seats || {},
              sanitizedRows,
              cm.driverName
            );
            await updateDoc(carRef, {
              name: trimmedName,
              vehicleType: isMoto ? 'motorcycle' : 'car',
              departureTime: cm.departureTime.trim(),
              pickupLocation: cm.pickupLocation.trim(),
              note: cm.note.trim(),
              imageUrl: (cm.imageUrl || '').trim(),
              qrCodeUrl: (cm.qrCodeUrl || '').trim(),
              colorTheme: cm.colorTheme || 'indigo',
              driveSide: cm.driveSide || 'RHD',
              layoutRows: sanitizedRows,
              layoutType,
              seats: updatedSeats
            });
            showToast(t('toastUpdatedCar', trimmedName, layoutType));
          }
          state.activeModal = null;
          renderModals();
        } catch (err) {
          console.error('Error saving car:', err);
          showToast(t('toastSaveCarFailed'), 'error');
        }
      },

        const seatDefs = getSeatsForLayout(getCarLayoutRows(car));

        const firstOpenDef = seatDefs.find(

        if (!firstOpenDef) {
          showToast(t('toastNoOpenSeats'), 'error');

        try {

            state.db,
            'artifacts',
            appId,
            'public',
            'data',
            'carpool_cars',
            car.id

          await updateDoc(carRef, { seats });

            seats: {
              driver: { name: 'Sarah Jenkins', note: 'Driver • Has toll pass', status: 'confirmed', updatedAt: now },
              front_pax: { name: 'Marcus Vance', note: 'Playlist DJ', status: 'confirmed', updatedAt: now },
              mid_left: { name: 'Elena Rostova', note: 'Pickup at Oak St', status: 'confirmed', updatedAt: now },
              mid_center: { name: '', note: '', status: 'confirmed', updatedAt: null },
              mid_right: { name: 'Devon Brooks', note: '1 small duffel', status: 'interested', updatedAt: now },
              back_left: { name: '', note: '', status: 'confirmed', updatedAt: null },
              back_right: { name: '', note: '', status: 'confirmed', updatedAt: null }
            }
          });

          await addDoc(carsCol, {
            name: "Kevin's Kia Carnival (Captain Chairs 2-2-3)",
            departureTime: '08:30 AM',
            pickupLocation: 'Westside Mall Lot B',
            note: '2nd row has two Captain Chairs with center aisle access to the 3-seat back bench!',
            colorTheme: 'emerald',
            driveSide: 'RHD',
            layoutRows: [2, 2, 3],
            layoutType: '2-2-3',
            weekKey: currentWeekKey,
            createdAt: now + 100,
            createdBy: state.user.uid,
            seats: {
              driver: { name: 'Kevin Park', note: 'Driver', status: 'confirmed', updatedAt: now },
              front_pax: { name: '', note: '', status: 'confirmed', updatedAt: null },
              mid_left: { name: 'Priya Patel', note: 'Bringing snacks!', status: 'confirmed', updatedAt: now },
              mid_right: { name: 'Lucas Meyer', note: 'Tentative on 8am call', status: 'interested', updatedAt: now },
              back_left: { name: '', note: '', status: 'confirmed', updatedAt: null },
              back_center: { name: '', note: '', status: 'confirmed', updatedAt: null },
              back_right: { name: '', note: '', status: 'confirmed', updatedAt: null }
            }
          });

          await addDoc(carsCol, {
            name: "Alex's Honda CR-V (5-Seat 2-3)",
            departureTime: '09:15 AM',
            pickupLocation: 'Downtown Coffee Roasters',
            note: 'Standard 5-seat (2-3) SUV. Fast highway route.',
            colorTheme: 'amber',
            driveSide: 'RHD',
            layoutRows: [2, 3],
            layoutType: '2-3',
            weekKey: currentWeekKey,
            createdAt: now + 200,
            createdBy: state.user.uid,
            seats: {
              driver: { name: 'Alex Rivera', note: 'Driver', status: 'confirmed', updatedAt: now },
              front_pax: { name: 'Hannah Kim', note: 'Confirmed shotgun', status: 'confirmed', updatedAt: now },
              mid_left: { name: '', note: '', status: 'confirmed', updatedAt: null },
              mid_center: { name: '', note: '', status: 'confirmed', updatedAt: null },
              mid_right: { name: '', note: '', status: 'confirmed', updatedAt: null }
            }
          });

          showToast('Loaded 3 sample cars (2-3-2, 2-2-3, and 2-3)!');
        } catch (err) {
          console.error('Error seeding cars:', err);
          showToast('Failed to load sample cars.', 'error');
        }
      },

      copySummary: () => {
        if (state.cars.length === 0) {
          showToast('No cars to copy yet!', 'error');
          return;
        }
        const lines = ['🚗 REAL-TIME CARPOOL ROSTER 🚗', ''];
        state.cars.forEach((car, idx) => {
          const layoutRows = getCarLayoutRows(car);
          const pattern = formatLayoutPattern(layoutRows);
          const seatDefs = getSeatsForLayout(layoutRows);
          const totalSeats = seatDefs.length;
          const seats = car.seats || {};
          const occupiedCount = seatDefs.filter(
            (s) => seats[s.id]?.name && seats[s.id].name.trim() !== ''
          ).length;
          const leftCount = Math.max(0, totalSeats - occupiedCount);

          lines.push(
            `${idx + 1}. ${car.name} [${totalSeats} Seats • ${pattern} Layout] (${occupiedCount}/${totalSeats} occupied • ${leftCount} left)`
          );
          if (car.departureTime || car.pickupLocation) {
            lines.push(
              `   📍 ${[car.departureTime, car.pickupLocation].filter(Boolean).join(' @ ')}`
            );
          }
          if (car.note) lines.push(`   📝 Note: ${car.note}`);

          seatDefs.forEach((seatDef) => {
            const s = seats[seatDef.id];
            const occupant = s?.name?.trim() ? s.name.trim() : '--- [OPEN SEAT] ---';
            const statusTag =
              s?.name?.trim() && s?.status === 'interested' ? ' (Interested / Maybe)' : '';
            const noteTag = s?.name?.trim() && s?.note ? ` - "${s.note}"` : '';
            lines.push(
              `   • [${seatDef.shortLabel}] ${seatDef.label}: ${occupant}${statusTag}${noteTag}`
            );
          });
          lines.push('');
        });

        const textArea = document.createElement('textarea');
        textArea.value = lines.join('\n');
        document.body.appendChild(textArea);
        textArea.select();
        try {
          document.execCommand('copy');
          showToast('Copied full carpool roster to clipboard!');
        } catch (err) {
          showToast('Failed to copy roster.', 'error');
        }
        document.body.removeChild(textArea);
      }
    };

    // ==========================================
    // INITIALIZE FIREBASE & REAL-TIME LISTENER
    // ==========================================
    // Global tactile button click listener for interactive sound effects
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('button, label, tr[onclick]');
      if (!btn) return;
      // Skip generic click sound if it's the BGM/SFX toggle or a seat button (which plays its own tone)
      if (btn.classList.contains('bgm-toggle-btn') || btn.classList.contains('sfx-toggle-btn')) return;
      const onclickAttr = btn.getAttribute('onclick') || '';
      if (onclickAttr.includes('openSeatModal')) return;
      soundEngine.playSfx('click');
    });

    const runSplashScreenTransition = () => {
      const splash = document.getElementById('splashScreen');
      if (!splash) return;

      // Show splash screen for ~1.5 seconds, then smoothly fade & scale out
      setTimeout(() => {
        splash.classList.add('opacity-0', 'scale-105', 'pointer-events-none');
        setTimeout(() => {
          if (splash && splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
        }, 720);
      }, 1500);
    };

    const initApplication = async () => {
      applyDarkModeUI();
      renderApp();
      runSplashScreenTransition();

      if (!firebaseConfig || !firebaseConfig.apiKey) {
        state.loading = false;
        const banner = document.getElementById('errorBanner');
        const bannerText = document.getElementById('errorBannerText');
        if (banner && bannerText) {
          banner.classList.remove('hidden');
          bannerText.innerHTML =
            '<strong>External Hosting Setup Needed:</strong> Paste your free Firebase project config into <code>YOUR_OWN_FIREBASE_CONFIG</code> inside <code>index.html</code> to enable real-time database sync on your custom URL.';
        }
        renderApp();
        return;
      }

      try {
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        state.db = db;

        // Rule 3: Authenticate FIRST before any Firestore query
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }

        onAuthStateChanged(auth, (currentUser) => {
          state.user = currentUser;
          const footerEl = document.getElementById('sessionFooterId');
          if (footerEl) {
            footerEl.textContent = `Session ID: ${currentUser ? currentUser.uid : 'Disconnected'}`;
          }

          if (!currentUser) return;

          // Rule 1 & Rule 2: Strict path & simple collection query
          const carsColRef = collection(
            db,
            'artifacts',
            appId,
            'public',
            'data',
            'carpool_cars'
          );

          onSnapshot(
            carsColRef,
            (snapshot) => {
              const loaded = snapshot.docs.map((docSnap) => ({
                id: docSnap.id,
                ...docSnap.data()
              }));
              loaded.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

              // Automatic Weekly Seat Reset (Every Monday at 00:00)
              const { weekKey: currentWeekKey, weekStartMs } = getCurrentWeekInfo();
              loaded.forEach((car) => {
                const isFromPreviousWeek =
                  (car.weekKey && car.weekKey !== currentWeekKey) ||
                  (!car.weekKey && car.createdAt && car.createdAt < weekStartMs);

                const carRef = doc(
                  db,
                  'artifacts',
                  appId,
                  'public',
                  'data',
                  'carpool_cars',
                  car.id
                );

                if (isFromPreviousWeek) {
                  const driverKeep = car.seats?.driver?.name || '';
                  const resetSeats = createEmptySeats(driverKeep, getCarLayoutRows(car));
                  car.seats = resetSeats;
                  car.weekKey = currentWeekKey;
                  updateDoc(carRef, {
                    seats: resetSeats,
                    weekKey: currentWeekKey,
                    lastWeeklyResetAt: Date.now()
                  }).catch((e) => console.error('Weekly seat reset error:', e));
                } else if (!car.weekKey) {
                  car.weekKey = currentWeekKey;
                  updateDoc(carRef, { weekKey: currentWeekKey }).catch(() => {});
                }
              });

              state.cars = loaded;
              state.loading = false;
              state.isCloudConnected = true;
              renderApp();
            },
            (err) => {
              console.error('Firestore listener error:', err);
              state.loading = false;
              const banner = document.getElementById('errorBanner');
              const bannerText = document.getElementById('errorBannerText');
              if (banner && bannerText) {
                banner.classList.remove('hidden');
                bannerText.innerHTML =
                  '<strong>Database Permission Needed:</strong> In your Firebase Console, go to <strong>Build &rarr; Firestore Database</strong>, create the database in <strong>Test mode</strong>, and publish the rules.';
              }
              renderApp();
            }
          );
        });
      } catch (err) {
        console.error('Firebase initialization error:', err);
        state.loading = false;
        const banner = document.getElementById('errorBanner');
        const bannerText = document.getElementById('errorBannerText');
        if (banner && bannerText) {
          banner.classList.remove('hidden');
          bannerText.innerHTML =
            '<strong>One Last Firebase Toggle:</strong> In your Firebase Console, click <strong>Build &rarr; Authentication &rarr; Get started &rarr; Anonymous &rarr; Enable &rarr; Save</strong>, then refresh this page.';
        }
        renderApp();
      }
    };

    window.addEventListener('DOMContentLoaded', initApplication);
  </script>
